      refreshStatus();
      loadRepos();
      loadCommits();
    };
    es.onmessage = (ev) => {
      const snap = JSON.parse(ev.data);
      appendLines(snap.lines || []);
      if (snap.status === "done") {
        es.close();
        state.es = null;
        finish(snap);
      }
    };
    es.onerror = () => {
      es.close();
      if (!state.job) return;
      const poll = async () => {
        try {
          const snap = await api(`/api/jobs/${id}`);
          appendLines(snap.lines || []);
          if (snap.status === "done") {
            finish(snap);
            return;
          }
        } catch { /* keep trying */ }
        setTimeout(poll, 1200);
      };
      setTimeout(poll, 600);
    };
  }

  // ---------------------------------------------------------------- commits
  function when(iso, withTime = true) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "";
    const parts = { month: "short", day: "numeric" };
    if (withTime) Object.assign(parts, { hour: "2-digit", minute: "2-digit" });
    return d.toLocaleString(undefined, parts);
  }

  async function loadCommits() {
    if (!state.repo) return;
    const box = $("commits");
    try {
      const data = await api(`/api/repos/${state.repo.id}/commits?limit=20`);
      $("commits-hint").textContent = data.total
        ? `${data.shown} of ${data.total} on ${data.branch}`
        : `nothing on ${data.branch}`;
      if (!data.commits.length) {
        box.replaceChildren(el("div", { class: "hint", style: "padding:8px 6px" }, "This branch has no commits yet."));
        return;
      }
      box.replaceChildren(...data.commits.map((c) =>
        el("div", { class: "commit" },
          el("span", { class: "sha" }, c.short),
          el("span", { class: "subject", title: c.subject }, c.subject),
          el("span", { class: "meta" },
            el("span", { class: c.signed ? "sig" : "sig none", title: c.signed ? "Signed commit" : "Unsigned commit" },
              icon(c.signed ? "check" : "dash")),
            el("span", {}, c.author),
            el("span", {}, when(c.date))))));
    } catch (err) {
      $("commits-hint").textContent = "";
      box.replaceChildren(el("div", { class: "hint", style: "padding:8px 6px" }, err.message));
    }
  }

  // ---------------------------------------------------------------- signing
  function stepList(html) {
    const ol = el("ol", { class: "steps" });
    for (const line of html) ol.append(el("li", { html: "" }, line));
    for (const li of ol.children) li.innerHTML = li.textContent;
    return ol;
  }

  // --------------------------------------------------------------- access
  function pillRow(label, valueNode) {
    return el("div", { class: "sign-row" },
      el("div", { class: "k" }, label),
      el("div", { class: "v" }, valueNode));
  }

  function renderAuthBanner() {
    const box = $("auth-banner");
    const a = state.auth;
    if (!a) return;
    box.hidden = false;
    const gh = a.gh || {};
    if (!gh.installed) {
      box.replaceChildren(el("div", { class: "banner err", style: "margin-bottom:14px" },
        el("span", { class: "ico" }, icon("triangle-alert")),
        el("div", {}, el("b", {}, "gh is not installed in this container."),
          " Pull requests cannot be read and private repos cannot be cloned.")));
      return;
    }
    if (!gh.authenticated) {
      box.replaceChildren(el("div", { class: "banner warn", style: "margin-bottom:14px" },
        el("span", { class: "ico" }, icon("triangle-alert")),
        el("div", { style: "flex:1" },
          el("b", {}, "GitHub is not connected."),
          " PR checks cannot be read, private clones will fail, and pushes over HTTPS have no credentials.",
          el("div", { style: "margin-top:8px" },
            el("button", { class: "btn primary", onclick: () => openSettings("access-body") }, "Connect GitHub")))));
      return;
    }
    box.hidden = true;
    box.replaceChildren();
  }

  async function refreshAuth() {
    try {
      state.auth = await api("/api/auth");
    } catch { /* the dashboard still works without it */ }
    renderAuthBanner();
  }

  // Every card loads on its own, so a slow gh answer never hides the rest.
  function openSettings(focus) {
    state.returnTo = state.view === "repo" ? "repo" : "dashboard";
    show("settings");
    renderAccess();
    refreshAuth().then(renderAccess);
    loadSigning();
    renderInfo();
    renderSettings().then(() => {
      if (focus) $(focus).scrollIntoView({ block: "start" });
    });
  }

  async function renderSettings() {
    try {
      state.settings = await api("/api/settings");
    } catch (err) {
      $("identity-body").replaceChildren(el("div", { class: "banner err" }, err.message));
      return;
    }
    renderIdentity();
    renderClaims();
  }

  function renderIdentity() {
    const id = state.settings.identity;
    const name = el("input", { class: "field", id: "id-name", placeholder: "Your name", autocomplete: "name", value: id.name || "" });
    const email = el("input", { class: "field", id: "id-email", placeholder: "you@example.com", autocomplete: "email", value: id.email || "" });
    const save = el("button", { class: "btn primary", id: "id-save", onclick: async () => {
      save.disabled = true;
      try {
        state.settings = await post("/api/settings", { action: "identity", name: name.value, email: email.value });
        toast("identity saved");
        renderIdentity();
        renderClaims();
      } catch (err) {
        toast(err.message);
        save.disabled = false;
      }
    } }, "Save");
    $("identity-body").replaceChildren(el("div", { class: "card", id: "card-identity" },
      el("div", { class: "card-head" }, el("h2", {}, "Identity"), el("span", { class: "hint" }, "git config user.name, user.email")),
      el("div", { class: "card-body", style: "display:grid;gap:10px" },
        el("div", { class: "hint" }, "Every commit a run claims gets this author and committer."),
        el("div", { class: "sign-fields" }, name, email),
        el("div", {}, save))));
  }

  // A list of values as pills with one text field: Enter or a comma adds the
  // typed value, Backspace on an empty field removes the last pill.
  function chipEditor(id, values, placeholder) {
    const items = [...values];
    const box = el("div", { class: "chip-edit", id });
    const input = el("input", { placeholder, "aria-label": placeholder, autocomplete: "off", spellcheck: "false" });
    const draw = () => box.replaceChildren(...items.map((v, i) =>
      el("span", { class: "pill mono" }, v,
        el("button", { type: "button", "aria-label": `Remove ${v}`, onclick: () => { items.splice(i, 1); draw(); } }, icon("x")))),
      input);
    const add = () => {
      const v = input.value.trim().replace(/,+$/, "").trim();
      if (v && !items.includes(v)) items.push(v);
      input.value = "";
      draw();
    };
    input.onkeydown = (event) => {
      if (event.key === "Enter" || event.key === ",") {
        event.preventDefault();
        add();
        input.focus();
      } else if (event.key === "Backspace" && !input.value && items.length) {
        items.pop();
        draw();
        input.focus();
      }
    };
    input.onblur = () => { if (input.value.trim()) add(); };
    box.onclick = (event) => { if (event.target === box) input.focus(); };
    draw();
    return { box, values: () => items.slice() };
  }

  function renderClaims() {
    const c = state.settings.claims;
    const emails = chipEditor("claim-emails", c.emails, "add an email");
    const names = chipEditor("claim-names", c.names, "add a name");
    const save = el("button", { class: "btn primary", id: "claims-save", onclick: async () => {
      save.disabled = true;
      try {
        state.settings = await post("/api/settings", { action: "claims", emails: emails.values(), names: names.values() });
        toast("claim rules saved");
        renderClaims();
      } catch (err) {
        toast(err.message);
        save.disabled = false;
      }
    } }, "Save");
    $("claims-body").replaceChildren(el("div", { class: "card", id: "card-claims" },
      el("div", { class: "card-head" }, el("h2", {}, "Claimed commits"), el("span", { class: "hint" }, "git config arena.claim-email, arena.claim-name")),
      el("div", { class: "card-body", style: "display:grid;gap:10px" },
        el("div", { class: "hint" }, "A run rewrites every commit by one of these emails or names onto the identity above. The configured email is always claimed."),
        el("div", { class: "claim-label" }, "Emails"), emails.box,
        el("div", { class: "claim-label" }, "Names"), names.box,
        el("div", { class: "hint" }, "An empty list falls back to the built-in rule: ",
          el("code", {}, c.defaults.emails.join(", ")), " and ", el("code", {}, c.defaults.names.join(", ")), "."),
        el("div", {}, save))));
  }

  async function renderAccess() {
    const body = $("access-body");
    const a = state.auth;
    if (!a) {
      body.replaceChildren(el("div", { class: "hint" }, "loading…"));
      return;
    }
    const gh = a.gh || {};
    const g = a.git || {};
    const nodes = [];
    const ghNodes = [];

    // -- gh -------------------------------------------------------------
    if (!gh.installed) {
      ghNodes.push(el("div", { class: "banner err" }, "gh is not installed in this container. Rebuild the image, it bundles the GitHub CLI."));
    } else if (gh.authenticated) {
      ghNodes.push(el("div", { class: "banner ok" },
        el("span", { class: "ico" }, icon("check")),
        el("div", {}, el("b", {}, `Signed in as @${gh.login}`), ` on ${gh.host}`,
          gh.source === "environment" ? ". The token comes from the GH_TOKEN environment variable." : ".")));
      if (gh.scopes) {
        const missing = !/\brepo\b/.test(gh.scopes) ? " · no repo scope, so private repos and PR checks are invisible" : "";
        ghNodes.push(pillRow("token scopes", el("span", { class: "mono", style: "color:var(--muted)" }, gh.scopes + missing)));
      }
      ghNodes.push(el("div", { style: "display:flex;gap:8px;margin-top:4px" },
        el("button", { class: "btn", onclick: async () => {
          await post("/api/auth", { action: "check" });
          await refreshAuth();
          renderAccess();
          toast("re-checked");
        } }, "Re-check"),
        g.credentials_for_gh ? null : el("button", { class: "btn ghost", onclick: setupGit }, "Configure git credentials")));
    } else {
      ghNodes.push(el("div", { class: "banner warn" },
        el("span", { class: "ico" }, icon("triangle-alert")),
        el("div", {}, el("b", {}, "Not signed in to GitHub."),
          " Private clones, PR checks, and HTTPS pushes will fail until gh has a token.")));
      const input = el("input", { class: "field mono-field", type: "password", id: "token-input",
        placeholder: "ghp_… or github_pat_…", autocomplete: "off", spellcheck: "false",
        onkeydown: (e) => { if (e.key === "Enter") submitToken(); } });
      ghNodes.push(el("label", { for: "token-input", class: "opt-label", style: "margin-top:10px" },
        "Personal access token", el("span", { class: "desc" }, "repo, read:org")));
      ghNodes.push(el("div", { style: "display:flex;gap:8px;margin-top:6px" },
        input,
        el("button", { class: "btn primary", id: "token-btn", onclick: submitToken }, "Sign in")));
      ghNodes.push(el("div", { class: "hint", style: "margin-top:8px" },
        "Create one at ",
        el("a", { href: "https://github.com/settings/tokens/new?scopes=repo,read:org&description=arena-cleanup", target: "_blank", rel: "noopener", style: "text-decoration:underline" }, "github.com/settings/tokens"),
        " with the ", el("code", {}, "repo"), " scope. It is handed to gh over stdin and stored in this container's volume, never in this page."));
      ghNodes.push(el("div", { class: "hint", style: "margin-top:6px" },
        "Prefer a browser login? Run ", el("code", {}, "docker exec -it arena-cleanup gh auth login"),
        " next to this app, or set ", el("code", {}, "GH_TOKEN"), " when starting the container."));
    }

    nodes.push(el("div", { class: "card" },
      el("div", { class: "card-head" }, el("h2", {}, "GitHub")),
      el("div", { class: "card-body" }, ...ghNodes)));

    // -- how git gets in -------------------------------------------------
    const gitRows = [
      pillRow("credential helper", g.credentials_for_gh
        ? el("span", { class: "pill ok" }, el("i", { class: "dot" }), "gh auth git-credential")
        : (g.credential_helpers && g.credential_helpers.length
          ? el("span", { class: "mono" }, g.credential_helpers.join(", "))
          : el("span", { class: "pill warn" }, "none"))),
      pillRow("ssh keys", g.ssh_keys && g.ssh_keys.length
        ? el("span", { class: "mono" }, g.ssh_keys.join(", "))
        : el("span", { class: "hint" }, "none in this container")),
    ];
    const gitBanner = gh.authenticated && !g.credentials_for_gh
      ? el("div", { class: "banner warn", style: "margin-bottom:10px" },
          el("span", { class: "ico" }, icon("triangle-alert")),
          el("div", {}, el("b", {}, "git has no credential helper yet."),
            " Cloning and pushing over HTTPS will fail. One click fixes it, and applies to every repo here."))
      : null;
    nodes.push(el("div", { class: "card" },
      el("div", { class: "card-head" }, el("h2", {}, "How git reaches GitHub"),
        el("div", { class: "grow" }),
        gh.authenticated && !g.credentials_for_gh
          ? el("button", { class: "btn", onclick: setupGit }, "Configure") : null),
      el("div", { class: "card-body" },
        gitBanner || el("div", {}),
        ...gitRows,
        el("div", { class: "hint", style: "margin-top:10px" },
          "Repos cloned with a ", el("code", {}, "git@github.com:"), " URL use SSH instead and ignore the credential helper. To use your own SSH key, mount it: ",
          el("code", {}, "-v ~/.ssh:/home/arena/.ssh:ro")))));

    body.replaceChildren(...nodes);
  }

  function renderInfo() {
    $("info-body").replaceChildren(el("div", { class: "card" },
      el("div", { class: "card-head" }, el("h2", {}, "About")),
      el("div", { class: "card-body" },
        pillRow("ui", el("span", { class: "mono" }, state.env ? `v${state.env.version}, engine ${state.env.tool}` : "?")),
        pillRow("machine", el("span", { class: "mono" }, state.env ? `${state.env.arch}, python ${state.env.python}` : "?")),
        pillRow("data", el("span", { class: "mono" }, state.env ? state.env.data : "?")))));
  }

  async function submitToken() {
    const input = $("token-input");
    const btn = $("token-btn");
    const token = (input.value || "").trim();
    if (!token) return;
    btn.disabled = true;
    btn.setAttribute("aria-busy", "true");
    btn.replaceChildren(el("span", { class: "spin", "aria-hidden": "true" }), " Sign in");
    try {
      await post("/api/auth", { action: "token", token });
      input.value = "";
      await refreshAuth();
      await loadRepos();
      renderAccess();
      toast("signed in");
    } catch (err) {
      toast(err.message);
      btn.disabled = false;
      btn.removeAttribute("aria-busy");
      btn.textContent = "Sign in";
    }
  }

  async function setupGit() {
    try {
      await post("/api/auth", { action: "setup_git" });
      await refreshAuth();
      renderAccess();
      toast("git credentials configured");
    } catch (err) {
      toast(err.message);
    }
  }

  async function loadSigning() {
    $("signing-body").replaceChildren(el("div", { class: "hint" }, "loading…"));
    try {
      state.signing = await api("/api/signing");
    } catch (err) {
      $("signing-body").replaceChildren(el("div", { class: "banner err" }, err.message));
      return;
    }
    renderSigning();
  }

  function renderSigning() {
    const s = state.signing;
    const body = $("signing-body");
    const nodes = [];

    if (!s.gpg) {
      nodes.push(el("div", { class: "banner err" }, "gpg is not installed in this container, so commits cannot be signed. Rebuild the image (it includes gnupg2)."));
    }

    const active = s.keys.find((k) => k.fingerprint === s.active);
    if (s.keys.length && s.signingkey && active) {
      nodes.push(el("div", { class: "banner ok" }, "Signing is on: commits are signed with " + active.uid));
    } else if (s.keys.length) {
      nodes.push(el("div", { class: "banner warn" }, "A key exists but git is not configured to use it. Select one below."));
    } else if (s.gpg) {
      nodes.push(el("div", { class: "banner warn" }, "No GPG key in this container yet. Create one below. The key is generated inside the container and never leaves it."));
    }

    // the warning the whole panel exists for
    if (active && s.github.checked && !active.on_github) {
      nodes.push(el("div", { class: "banner warn" },
        el("span", { class: "ico" }, icon("triangle-alert")),
        el("div", {},
          el("b", {}, "This key is not assigned to your GitHub account."),
          " Commits will show as “Unverified” until you add the public key at ",
          el("a", { href: "https://github.com/settings/gpg/new", target: "_blank", rel: "noopener", style: "text-decoration:underline" }, "github.com/settings/gpg/new"),
          " (and the key's email matches a verified email on the account).")));
    } else if (active && s.github.checked && active.on_github) {
      nodes.push(el("div", { class: "banner ok" }, "This key is assigned to your GitHub account."));
    } else if (s.github.error) {
      nodes.push(el("div", { class: "banner warn" }, "Could not check GitHub: " + s.github.error));
    }

    // key list
    const list = el("div", { class: "card" },
      el("div", { class: "card-head" }, el("h2", {}, "Keys in this container"), el("div", { class: "grow" }), el("span", { class: "hint" }, `${s.keys.length} found`)),
      el("div", { class: "card-body" }, ...(s.keys.length ? s.keys.map((k) =>
        el("div", { class: "sign-row" },
          el("div", { class: "sign-key" },
            el("b", {}, k.uid || "(no uid)"),
            el("div", {}, k.fingerprint),
            k.on_github ? el("span", { class: "pill ok", style: "margin-top:6px" }, "on GitHub") : null),
          k.fingerprint === s.active
            ? el("span", { class: "pill ok" }, "active")
            : el("button", { class: "btn", onclick: async () => {
                await post("/api/signing", { action: "use", fingerprint: k.fingerprint });
                await loadSigning();
              } }, "Use"),
          el("button", { class: "btn ghost", onclick: async () => {
            const out = await post("/api/signing", { action: "public_key", fingerprint: k.fingerprint });
            navigator.clipboard?.writeText(out.public_key || "");
            toast("public key copied");
          } }, "Copy public key"))
        ) : [el("div", { class: "hint" }, "No secret keys.")])));
    nodes.push(list);

    // create
    const name = el("input", { class: "field", id: "gpg-name", placeholder: "Your name", value: s.git_name || "" });
    const email = el("input", { class: "field", id: "gpg-email", placeholder: "you@example.com", value: s.git_email || "" });
    const createBtn = el("button", { class: "btn primary", onclick: async () => {
      createBtn.disabled = true;
      createBtn.textContent = "Creating…";
      try {
        await post("/api/signing", { action: "create", name: name.value, email: email.value });
        toast("key created");
        await loadSigning();
      } catch (err) {
        toast(err.message);
      } finally {
        createBtn.disabled = !s.gpg;
        createBtn.textContent = "Create key";
      }
    } }, "Create key");
    if (!s.gpg) {
      createBtn.disabled = true;
      createBtn.title = "gpg is not installed";
    }

    nodes.push(el("div", { class: "card" },
      el("div", { class: "card-head" }, el("h2", {}, s.keys.length ? "Create another key" : "Create a key"), el("span", { class: "hint" }, "ed25519, no passphrase, generated inside the container")),
      el("div", { class: "card-body", style: "display:grid;gap:10px" },
        el("div", { class: "sign-fields" }, name, email),
        createBtn,
        el("div", { class: "hint" }, "The private key stays in /home/arena/.gnupg inside this container's volume. Export it if you also want to sign on your laptop."),
      )));

    // steps
    nodes.push(el("div", { class: "card" },
      el("div", { class: "card-head" }, el("h2", {}, "Add the public key to GitHub")),
      el("div", { class: "card-body" },
        stepList([
          "Copy the public key (<b>Copy public key</b> above).",
          "Open <a href=\"https://github.com/settings/gpg/new\" target=\"_blank\" rel=\"noopener\">github.com/settings/gpg/new</a>.",
          "Paste the block that starts with <code>-----BEGIN PGP PUBLIC KEY BLOCK-----</code>.",
          "Add the key, then come back here and press <b>Re-check</b>.",
        ]),
        el("div", { style: "margin-top:12px;display:flex;gap:8px;flex-wrap:wrap" },
          el("button", { class: "btn", onclick: async () => { await loadSigning(); toast("re-checked"); } }, "Re-check"),
          el("a", { class: "btn ghost", href: "https://github.com/settings/keys", target: "_blank", rel: "noopener" }, "Open GitHub keys")))));

    body.replaceChildren(...nodes);
  }

  // ---------------------------------------------------------------- wiring
  $("add-btn").onclick = addRepo;
  $("add-source").onkeydown = (ev) => { if (ev.key === "Enter") addRepo(); };
  $("add-source").oninput = () => addError("");
  $("back").onclick = () => {
    state.repo = null;  // don't let a closed repo come back as a "return" target
    show("dashboard");
    loadRepos();
  };
  $("settings-btn").onclick = () => openSettings();
  $("settings-back").onclick = goBack;

  window.addEventListener("hashchange", () => {
    // a pop this page asked for already shows its screen
    if ((location.hash || "#/") === hashFor(state.view)) return syncTitle();
    applyHash();
  });

  $("checks").onchange = (ev) => {
    const box = ev.target.closest("input[data-opt]");
    if (!box) return;
    // Update Tags is the positive form of the engine's --no-tags.
    if (box.dataset.opt === "update_tags") state.opts.no_tags = !box.checked;
    else state.opts[box.dataset.opt] = box.checked;
    renderCommand();
  };

  $("branch").onchange = (ev) => { state.branch = ev.target.value; renderSidebar(); renderCommand(); };
  $("arena").onchange = (ev) => { state.arena = ev.target.value; renderSidebar(); renderCommand(); };

  $("browse").onclick = async () => {
    const tree = $("tree");
    const open = tree.hidden;
    tree.hidden = !open;
    $("browse").setAttribute("aria-expanded", String(open));
    if (open && !tree.childElementCount) {
      try { await treeLevel(tree, "", 1); } catch (err) { toast(err.message); closeTree(); }
    }
  };
  $("pathin").onkeydown = (ev) => {
    if (ev.key === "Enter" && ev.target.value.trim()) {
      ev.preventDefault();
      const value = ev.target.value.trim().replace(/^\.\//, "").replace(/\/+$/, "");
      if (value && !state.paths.includes(value)) state.paths.push(value);
      ev.target.value = "";
      renderPaths();
      renderCommand();
    } else if (ev.key === "Backspace" && !ev.target.value && state.paths.length) {
      state.paths.pop();
      renderPaths();
      renderCommand();
    }
  };
  $("timeout").oninput = () => {
    $("timeout-out").value = `${timeoutMinutes()} min`;
    renderCommand();
  };

  $("start").onclick = () => startJob(payload());
  $("start-mobile").onclick = () => startJob(payload());
  const cancelJob = async () => {
    if (!state.job) return;
    await post(`/api/jobs/${state.job}/cancel`).catch(() => {});
    toast("cancelled");
  };
  $("cancel").onclick = cancelJob;
  $("cancel-mobile").onclick = cancelJob;

  $("logtoggle").onclick = () => setLogOpen($("logwrap").hidden);
  $("commits-refresh").onclick = () => {
    loadCommits();
    toast("reloaded");
  };

  $("options-fold").onclick = () => {
    const open = $("options").hidden;
    $("options").hidden = !open;
    $("options-fold").setAttribute("aria-expanded", String(open));
  };

  $("copy").onclick = async () => {
    const text = [...$("log").querySelectorAll(".log-row")].map((r) => r.querySelector(".msg")?.textContent ?? "").join("\n");
    try { await navigator.clipboard.writeText(text); toast("copied"); }
    catch {
      const ta = el("textarea", {});
      ta.value = text;
      document.body.append(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("copied");
    }
  };

  $("log").onscroll = () => {
    const log = $("log");
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 70;
    $("jump").classList.toggle("show", !nearBottom && log.scrollHeight > log.clientHeight);
  };
  // the whole chip strip is the input's hit target, not just the 32px field
  $("chips").addEventListener("click", (e) => {
    if (e.target.id === "chips") $("pathin").focus();
  });
  $("jump").onclick = () => {
    const log = $("log");
    log.scrollTop = log.scrollHeight;
    $("jump").classList.remove("show");
  };

  document.addEventListener("keydown", (ev) => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter" && !$("view-repo").hidden) {
      ev.preventDefault();
      if (!$("start").disabled) startJob(payload());
    }
  });

  async function boot() {
    resetPhases();
    renderCommand();
    try {
      const env = await api("/api/env");
      $("ver").textContent = "v" + env.version;
      $("ver").title = `UI ${env.version}, engine ${env.tool}, python ${env.python}, ${env.arch}`;
      const parts = [
        ["git", env.tools.git, "git"],
        ["gh", env.tools.gh, "gh"],
        ["filter-repo", env.tools["git-filter-repo"], "git-filter-repo"],
        ["gpg", env.tools.gpg, "gpg"],
      ];
      state.env = env;
      // colour alone is not a status: each dot carries the words too, even
      // when the phone layout hides the visible label
      $("env").replaceChildren(...parts.map(([label, ok, title]) =>
        el("span", {
          class: ok ? "on" : "",
          role: "img",
          "aria-label": `${title} ${ok ? "ready" : "missing"}`,
          title: `${title} ${ok ? "ready" : "missing"}`,
        }, el("i", {}), el("span", { class: "lbl" }, label))));
    } catch { /* the page still works without the badge */ }
    await refreshAuth();
    await loadRepos();
    await applyHash();
    // one primary input on a desktop screen: put the cursor in it. Phones get
    // no autofocus, where the keyboard opening shifts the whole layout.
    if (window.matchMedia("(pointer: fine)").matches && !location.hash.slice(2)
        && state.view === "dashboard") {
      $("add-source").focus({ preventScroll: true });
    }
    // a token can be added or revoked from a shell, so re-ask on a short clock
    setInterval(refreshAuth, 15000);
    setInterval(loadRepos, 20000);
  }
  window.addEventListener("online", () => loadRepos());
  window.addEventListener("offline", () => loadRepos());

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {
        /* no HTTPS, or a hardened browser: the app still works */
      });
    });
  }

  boot();
})();
</script>
</body>
</html>
