<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090b">
<meta name="description" content="Clean Arena agent branches, sign the rewrite, publish to your default branch.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="arena">
<meta name="application-name" content="arena-cleanup">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>arena-cleanup</title>
<style>
  /* Spacing scale: 1 (optical nudge) then every even step - 2 4 6 8 10 12 16
     20 24 32 40. Every padding, margin, and gap in this file lands on it;
     tools/measure.py fails the build when one drifts off. */
  @font-face {
    font-family: "Inter";
    src: url("fonts/inter.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/jetbrains-mono.woff2") format("woff2");
    font-weight: 100 800;
    font-display: swap;
  }

  :root {
    --bg: #08090b;
    --surface: #0d0f12;
    --surface-2: #12151a;
    --surface-3: #171b21;
    --line: #1b1f25;
    --line-2: #262c34;
    --text: #e9ebee;
    --muted: #9ba2ab;
    --dim: #7d858f;
    --accent: #6e79d6;
    --accent-hi: #868ff0;
    --accent-deep: #5661c9;
    --accent-deep-hi: #4f5ac4;
    --accent-soft: rgba(110, 121, 214, .14);
    --ok: #46b95c;
    --warn: #d6a032;
    --err: #f0574f;
    --info: #5aa2f7;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --pad: 20px;
    --fs-1: 12px;
    --fs-2: 13px;
    --fs-3: 14px;
    --fs-4: 16px;
    --fs-5: 20px;
    font-synthesis: none;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, a, select, input, [role="button"] { touch-action: manipulation; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scrollbar-gutter: stable; }
  html, body { height: 100%; }

  /* one scrollbar look everywhere, and a gutter that is reserved up front so
     a view that grows a scrollbar does not shove the page 10px sideways */
  * { scrollbar-width: thin; scrollbar-color: #2b313a transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: #2b313a; border-radius: 999px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #3c4450; background-clip: padding-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 var(--fs-3)/1.55 var(--sans);
    font-feature-settings: "cv05" 1, "ss03" 1;
    letter-spacing: -.006em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior-y: none;
  }
  ::selection { background: rgba(110, 121, 214, .3); }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  /* view headings take focus so a screen reader lands on the new screen;
     they are not controls, so they do not wear a ring */
  .view h1:focus-visible, .view h2:focus-visible { outline: none; }
  a { color: inherit; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  .skip {
    position: fixed; left: 8px; top: -60px; z-index: 40; padding: 12px 16px;
    background: var(--surface-3); border: 1px solid var(--accent); border-radius: 8px;
    color: var(--text); text-decoration: none; font-weight: 600; font-size: var(--fs-2);
    transition: top .12s ease-out;
  }
  .skip:focus { top: 8px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important; scroll-behavior: auto !important;
    }
  }
  h1, h2, h3 { letter-spacing: -.02em; }
  /* columns of numbers should not jitter as they change */
  .log-row .t, .pill.mono, .kv dd, #statustext, .repo-card .meta, .arena-row .prlink {
    font-variant-numeric: tabular-nums;
  }

  .app { display: flex; flex-direction: column; min-height: 100%; }

  /* ------------------------------------------------------------- top bar */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 var(--pad); flex: none;
    border-bottom: 1px solid var(--line);
    background: rgba(8, 9, 11, .86);
    backdrop-filter: saturate(160%) blur(12px);
  }
  .brand {
    display: flex; align-items: center; gap: 8px; align-self: stretch; font-weight: 620; font-size: var(--fs-3);
    color: inherit; text-decoration: none; border-radius: 8px; padding: 4px 6px; margin-left: -6px;
  }
  .brand:hover .name { color: var(--accent-hi); }
  .brand svg { display: block; }
  .chip {
    font: 500 var(--fs-1)/1 var(--mono); color: var(--muted);
    border: 1px solid var(--line-2); border-radius: 6px;
    padding: 2px 6px; background: var(--surface-2);
  }
  .grow { flex: 1; }

  .env-dots { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: var(--fs-1); }
  .env-dots span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--dim); }
  .env-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--err); display: inline-block; }
  .env-dots span.on i { background: var(--ok); }

  /* the card X: a bare glyph at rest; the frame and the red come back under
     the pointer, on press, and while armed */
  .btn.ghost.rm { color: var(--dim); border-color: transparent; background: transparent; width: 30px; height: 30px; padding: 0; margin-left: auto; }
  .btn.ghost.rm:hover, .btn.ghost.rm:active { color: var(--err); border-color: rgba(240, 87, 79, .5); background: rgba(240, 87, 79, .1); }
  .btn.ghost.rm.armed { width: auto; padding: 0 10px; }
  .icon-btn {
    display: inline-grid; place-items: center; width: 32px; height: 32px; font-size: 16px;
    border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2);
    color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { color: var(--text); background: var(--surface-3); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 34px; padding: 0 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text);
    font-weight: 560; font-size: var(--fs-2); white-space: nowrap;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--surface-3); border-color: #313842; }
  .btn:active { transform: translateY(.5px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary {
    background: var(--accent-deep); border-color: #5c67c6; color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 1px 2px rgba(0, 0, 0, .5);
  }
  .btn.primary:hover { background: var(--accent-deep-hi); }
  /* a ghost button is a real button with a quieter fill, not a label: same
     border, same height, same contrast as the rest, so Copy and Cancel do not
     read as disabled next to the primary */
  .btn.ghost { background: transparent; border-color: var(--line-2); color: var(--text); }
  .btn.ghost:hover { background: var(--surface-2); border-color: #313842; }
  .btn.ghost:disabled { color: var(--dim); border-color: var(--line); }
  /* an armed destructive button, after the hover rule so it keeps its colour under the pointer */
  .btn.ghost.armed, .btn.ghost.armed:hover { color: var(--err); border-color: rgba(240, 87, 79, .5); background: rgba(240, 87, 79, .1); }
  .btn.danger { color: #ff9a94; }
  .btn.danger:hover { background: rgba(240, 87, 79, .1); border-color: rgba(240, 87, 79, .35); }
  .btn.back { padding: 0 10px; }
  .btn .spin {
    width: 12px; height: 12px; border-radius: 50%; display: inline-block;
    border: 1.6px solid currentColor; border-right-color: transparent;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn[aria-busy="true"] { cursor: progress; }
  .btn kbd, kbd.k { font: 500 var(--fs-1)/1 var(--mono); color: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.2); border-radius: 4px; padding: 2px 4px; }

  /* -------------------------------------------------------------- layout */
  main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .view:focus { outline: none; }
  #view-dashboard, #view-settings { overflow-y: auto; scrollbar-gutter: stable; }
  .wrap { width: min(1180px, 100%); margin: 0 auto; padding: 24px var(--pad) 40px; }

  /* ----------------------------------------------------------- dashboard */
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .hero h1, .wrap h1.page-title { font-size: var(--fs-5); font-weight: 640; margin: 0; }

  /* one border, not two: the bar is the field shell, so the input inside it
     drops its own frame and only the bar lights up */
  .addbar {
    display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 12px;
    border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface-2);
    transition: border-color .12s, box-shadow .12s;
  }
  .addbar:focus-within { border-color: #3d4655; box-shadow: 0 0 0 3px var(--accent-soft); }
  .addbar .field { flex: 1; min-width: 0; height: 34px; border: 0; background: transparent; padding: 0; }
  .addbar .field:focus { box-shadow: none; }
  /* the bar is the control: one ring on the bar, none on the borderless field */
  .addbar .field:focus-visible { outline: none; }
  .addbar:has(.field:focus-visible) { border-color: var(--accent-hi); }
  .field-error { margin: 8px 0 0; color: var(--err); font-size: var(--fs-1); }
  .field {
    width: 100%; height: 34px; background: var(--surface-2); border: 1px solid var(--line-2);
    border-radius: 8px; padding: 0 10px; color: var(--text); font-size: var(--fs-2); min-width: 0;
  }
  .field:focus { border-color: #3d4655; box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
  /* the ring has to survive the rule above: keyboard focus gets a solid one */
  .field:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 1px; }
  .mono-field { font-family: var(--mono); font-size: var(--fs-2); }
  select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: right 12px center, right 8px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 24px; }

  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); margin-top: 20px; }

  .repo-card {
    display: flex; flex-direction: column; gap: 12px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
    padding: 16px; text-align: left; cursor: pointer; color: inherit;
    transition: border-color .12s, background .12s, transform .12s;
  }
  .repo-card:hover { border-color: #2c333c; background: #0f1216; }
  .repo-card:hover .repo-name, .repo-card:focus-visible .repo-name { text-decoration: underline; text-underline-offset: 3px; }
  .repo-card:active { transform: translateY(1px); }
  .repo-head { display: flex; align-items: flex-start; gap: 10px; }
  .repo-ico {
    width: 30px; height: 30px; border-radius: 8px; flex: none; font-size: 16px;
    display: grid; place-items: center; background: var(--surface-3);
    border: 1px solid var(--line-2); color: var(--muted);
  }
  .repo-name { font-weight: 600; font-size: var(--fs-3); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .repo-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--fs-1); font-weight: 520; border-radius: 999px;
    padding: 4px 8px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--muted);
    white-space: nowrap; min-width: 0; max-width: 100%;
  }
  .pill .ptxt { overflow: hidden; text-overflow: ellipsis; }
  .pill b { font-weight: 600; color: var(--text); }
  .pill.ok { color: #8fe0a0; border-color: rgba(70,185,92,.3); background: rgba(70,185,92,.09); }
  .pill.warn { color: #f0c674; border-color: rgba(214,160,50,.32); background: rgba(214,160,50,.09); }
  .pill.err { color: #ff9a94; border-color: rgba(240,87,79,.32); background: rgba(240,87,79,.09); }
  .pill.run { color: #9dc7ff; border-color: rgba(90,162,247,.32); background: rgba(90,162,247,.09); }
  .pill.mono { font-family: var(--mono); font-size: var(--fs-1); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

  .arena-list { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
  .arena-row { display: flex; align-items: center; gap: 8px; font-size: var(--fs-2); min-width: 0; flex-wrap: wrap; row-gap: 2px; }
  /* the name takes the free width, so the pills need no auto margin */
  .arena-row .bname { flex: 1 1 auto; min-width: 0; font-family: var(--mono); font-size: var(--fs-1); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the checks pill is the link: one control, no orphan "Pull request" label */
  .arena-row .prlink { flex: none; display: inline-flex; align-items: center;
    text-decoration: none; border-radius: 999px; min-height: 24px; }
  .arena-row .prlink:hover .pill { border-color: var(--line-2); }
  .arena-row > .pill { flex: none; }
  /* a long arena name keeps its width and pushes the counts onto a second line */
  .row-btn.select { flex-wrap: wrap; row-gap: 2px; }
  .row-btn.select .txt { flex: 1 0 auto; max-width: 100%; }
  .row-btn.select .tail { display: inline-flex; gap: 8px; margin-left: auto; }
  .row-btn .ahead { display: inline-flex; align-items: center; gap: 2px; }

  /* what the selected task will do, in one sentence */
  /* pinned to the card bottom, so the buttons line up across a grid row */
  .card-actions { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  .card-actions .btn { height: 30px; font-size: var(--fs-2); padding: 0 12px; }

  .empty-state {
    border: 1px dashed var(--line-2); border-radius: 12px; padding: 32px 20px;
    text-align: center; color: var(--dim); margin-top: 20px; display: grid; gap: 6px; justify-items: center;
  }
  .empty-state strong { color: var(--text); font-weight: 560; }
  .empty-state code { font-family: var(--mono); font-size: var(--fs-1); color: var(--muted); }

  /* ----------------------------------------------------------- repo view */
  .detail { display: grid; grid-template-columns: 320px minmax(0, 1fr); flex: 1; min-height: 0; }
  /* Sticky beside the scrolling page: the facts stay put, the commit list scrolls inside. */
  .sidebar {
    border-right: 1px solid var(--line); background: var(--surface);
    padding: 16px 12px; overflow: auto; scrollbar-gutter: stable; display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 56px; height: calc(100vh - 56px); align-self: start;
  }
  .side-top { display: flex; flex-direction: column; gap: 20px; flex: 0 0 auto; }
  .side-group { display: flex; flex-direction: column; gap: 4px; }
  /* The commit list takes the rest of the column and scrolls on its own. */
  .side-commits { flex: 1 1 auto; min-height: 0; }
  .side-commits .commits { flex: 1 1 auto; min-height: 120px; overflow: auto; scrollbar-gutter: stable; }
  .side-label .btn { height: auto; padding: 2px 6px; font-size: var(--fs-1); font-weight: 600; }
  .side-label {
    font-size: var(--fs-1); font-weight: 600; letter-spacing: 0;
    color: var(--muted); padding: 0 6px 4px; display: flex; justify-content: space-between;
  }
  .kv { display: grid; grid-template-columns: 68px 1fr; gap: 2px 8px; padding: 0 6px; font-size: var(--fs-1); }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kv dd.mono { font-family: var(--mono); font-size: var(--fs-1); }

  .row-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0;
    text-align: left; color: var(--muted); padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: var(--fs-2);
  }
  .row-btn:hover { background: var(--surface-2); color: var(--text); }
  .row-btn .txt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: var(--fs-1); }
  /* an arena row selects the branch the run pulls from; the selected row keeps its mark */
  .row-btn.select[aria-pressed="true"] { background: var(--surface-2); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
  .row-btn.select:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row-btn .meta { flex: none; color: var(--dim); font: var(--fs-1) var(--mono); }

  .main-col { padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
  .detail-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .detail-head h1 { font-size: var(--fs-4); margin: 0; }
  .detail-head .sub { color: var(--dim); font-size: var(--fs-1); font-family: var(--mono); }

  .card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); flex: none; }
  /* every page that stacks cards gets the gap from one place */
  .stack { display: grid; gap: 16px; align-content: start; }
  .card-head { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .card-head h2 { margin: 0; font-size: var(--fs-2); font-weight: 600; }
  .card-head .hint { color: var(--dim); font-size: var(--fs-1); }
  .card-body { padding: 16px; }

  /* two columns: a field with its description needs about 360 px, which four cells never give */
  /* one grid, so the rows of both columns share their heights and lines */
  .options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 0 20px; }
  #opt-branch, #opt-arena, #opt-paths { grid-column: 1; }
  #opt-timeout, #checks { grid-column: 2; }
  .opt { padding: 8px 2px; border-bottom: 1px solid var(--line); min-width: 0; }
  .opt[hidden] { display: none; }
  /* the settings page labels its token field with a label and a short note */
  .opt-label { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .opt-label .desc { color: var(--dim); font-size: var(--fs-1); }
  /* one row per option: label, control, and a trailing action or readout */
  .opt.row { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; align-items: center; gap: 8px 12px; }
  .opt.row > label { font-weight: 560; font-size: var(--fs-2); white-space: nowrap; }
  .opt.row .tree { grid-column: 1 / -1; }
  .slider { width: 100%; margin: 0; accent-color: var(--accent); }
  .readout { font: var(--fs-1) var(--mono); color: var(--muted); min-width: 6ch; text-align: right; }
  .checks { display: flex; flex-wrap: wrap; align-content: start; gap: 8px 20px; padding: 10px 2px; }
  .check { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: var(--fs-2); cursor: pointer; }
  /* the box is drawn here, not by the browser: Lucide check, house radius, accent fill */
  .check input {
    appearance: none; width: 16px; height: 16px; margin: 0; flex: none; display: inline-grid; place-content: center;
    border: 1px solid #3d4655; border-radius: 4px; background: var(--surface-2); cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .check input::after {
    content: ""; width: 12px; height: 12px; background: #fff; opacity: 0; transition: opacity .12s;
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center / contain no-repeat;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>") center / contain no-repeat;
  }
  .check:hover input:not(:checked):not(:disabled) { border-color: #525c6b; }
  .check input:checked { background: var(--accent); border-color: var(--accent); }
  .check input:checked::after { opacity: 1; }
  .check.danger input:checked { background: var(--warn); border-color: var(--warn); }
  .check.danger input:checked::after { background: #0f1217; }
  .check input:disabled { opacity: .45; cursor: not-allowed; }
  .check:has(input:disabled) { cursor: not-allowed; }
  .check:has(input:checked) { color: var(--text); }
  .check.danger:has(input:checked) { color: var(--warn); }

  /* the whole options card folds from its head; closed, the head carries the
     branch pill and a one-line summary of what differs from the defaults */
  .fold-head { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .fold-head:hover { background: var(--surface-2); }
  .fold-head[aria-expanded="false"] { border-bottom: 0; }
  .fold-head .fold-title { font-size: var(--fs-2); font-weight: 600; }
  .fold-head .caret { display: inline-flex; color: var(--dim); transition: transform .12s; }
  .fold-head[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .fold-head[aria-expanded="true"] .pill, .fold-head[aria-expanded="true"] .hint { display: none; }
  .options[hidden] { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 34px; padding: 4px 6px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); }
  .chips:focus-within { border-color: #3d4655; box-shadow: 0 0 0 3px var(--accent-soft); }
  .chips input { flex: 1; min-width: 90px; height: 22px; border: 0; background: none; outline: none; font: var(--fs-1) var(--mono); }
  .chips input::placeholder { color: var(--dim); font-family: var(--mono); }
  .chip-x { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface-3); border-radius: 6px; padding: 2px 4px 2px 8px; font: var(--fs-1) var(--mono); }
  .chip-x button { border: 0; background: none; color: var(--dim); cursor: pointer; padding: 0 3px; font-size: var(--fs-3); line-height: 1; }
  .chip-x button:hover { color: var(--err); }
  .link-btn { margin-left: auto; border: 0; background: none; padding: 0; color: var(--muted); font: inherit; font-size: var(--fs-1); cursor: pointer; }
  .link-btn:hover, .link-btn[aria-expanded="true"] { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  /* the path tree: one level of the HEAD tree per request; a row click opens
     a folder or selects a file, the trailing button selects either */
  .tree { margin-top: 6px; padding: 4px; max-height: 260px; overflow: auto; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); font: var(--fs-1) var(--mono); }
  .tree-row { display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 4px 0 calc(4px + (var(--depth) - 1) * 16px); border-radius: 6px; cursor: pointer; color: var(--text); }
  .tree-row:hover { background: var(--surface-3); }
  .tree-caret { width: 14px; display: inline-flex; color: var(--dim); transition: transform .12s; }
  .tree-row[aria-expanded="true"] .tree-caret { transform: rotate(90deg); }
  .tree-ico { display: inline-flex; color: var(--muted); }
  .tree-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-select { margin-left: auto; display: inline-flex; align-items: center; border: 0; background: none; padding: 2px 4px; border-radius: 6px; color: var(--dim); cursor: pointer; }
  .tree-select:hover, .tree-select[aria-pressed="true"] { color: var(--accent-hi); }
  .tree-empty { padding: 4px 8px; color: var(--dim); }



  .console { display: flex; flex-direction: column; position: relative; }
  .console .card-head { border-bottom: 0; }

  /* GitHub-run shape: one row per stage, ticked off as the run moves */
  .phases { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .phase { border-bottom: 1px solid var(--line); }
  .phase:last-child { border-bottom: 0; }
  .phase-head {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 16px; color: var(--text); font-size: var(--fs-2); text-align: left;
  }
  .phase-ico {
    width: 16px; height: 16px; flex: none; display: grid; place-items: center;
    color: var(--dim); font-size: var(--fs-1); line-height: 1;
  }
  .phase[data-state="run"] .phase-ico { color: var(--accent-hi); }
  .phase[data-state="run"] .phase-ico svg { animation: spin .9s linear infinite; }
  .phase[data-state="done"] .phase-ico { color: var(--ok); }
  .phase[data-state="fail"] .phase-ico { color: var(--err); }
  .phase[data-state="skip"] .phase-ico { color: var(--dim); }
  .phase-name { font-weight: 560; flex: none; }
  .phase-sub {
    color: var(--dim); font: var(--fs-1) var(--mono); min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .phase-time {
    margin-left: auto; color: var(--dim); font: var(--fs-1) var(--mono); flex: none;
    font-variant-numeric: tabular-nums;
  }
  .run-foot {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    border-top: 1px solid var(--line);
  }
  .run-foot .hint { color: var(--dim); font-size: var(--fs-1); }
  .logwrap { position: relative; border-top: 1px solid var(--line); }
  .logwrap .log { max-height: 340px; padding: 8px 0 12px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font: 500 var(--fs-1)/1 var(--mono); color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 8px; background: var(--surface-2); }
  .status .led { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .status.running .led { background: var(--accent-hi); animation: pulse 1.4s ease-in-out infinite; }
  .status.ok .led { background: var(--ok); }
  .status.fail .led { background: var(--err); }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

  /* no overscroll containment here: with the wheel over the log and the log at
     its end, the page around it has to keep scrolling */
  .log { flex: 1; overflow: auto; padding: 8px 0 12px; font: var(--fs-1)/1.7 var(--mono); scrollbar-gutter: stable; }
  .log-row { display: grid; grid-template-columns: 74px 44px minmax(0, 1fr); gap: 10px; padding: 0 16px; }
  .log-row .t { color: #4f555e; }
  .log-row .lv { font-weight: 600; font-size: var(--fs-1); letter-spacing: .05em; padding-top: 2px; color: var(--dim); }
  .log-row .msg { color: #c6cbd2; white-space: pre-wrap; overflow-wrap: anywhere; }
  .log-row.ok .lv { color: var(--ok); }
  .log-row.warn .lv { color: var(--warn); }
  .log-row.error .lv { color: var(--err); }
  .log-row.info .lv { color: var(--info); }
  .log-row.cont .t, .log-row.cont .lv { visibility: hidden; }
  .log-row.cont .msg { color: #8b939d; }

  .commits { display: flex; flex-direction: column; }
  .commit {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px;
    align-items: center; padding: 8px 6px; border-top: 1px solid var(--line); font-size: var(--fs-2);
  }
  .commit:first-child { border-top: 0; }
  .commit .sha { font: var(--fs-1) var(--mono); color: var(--dim); }
  .commit .subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit .meta {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; color: var(--dim);
    font-size: var(--fs-1); white-space: nowrap; flex-wrap: wrap;
  }
  .commit .sig { color: var(--ok); font-size: var(--fs-1); }
  .commit .sig.none { color: var(--dim); }

  .empty-log { display: grid; place-items: center; gap: 8px; height: 100%; min-height: 190px; color: var(--dim); text-align: center; padding: 20px; }
  .empty-log p { margin: 0; max-width: 380px; font-size: var(--fs-2); line-height: 1.6; }
  .empty-log code { font-family: var(--mono); color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: var(--fs-1); }
  .jump { position: absolute; right: 16px; bottom: 16px; border: 1px solid var(--line-2); background: var(--surface-3); border-radius: 999px; padding: 4px 12px; font-size: var(--fs-1); cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.55); display: none; }
  .jump.show { display: block; }

  /* --------------------------------------------------------------- signing */
  .sign-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .sign-row:last-child { border-bottom: 0; }
  .sign-row .k { min-width: 120px; color: var(--dim); font-size: var(--fs-1); }
  .sign-row .v { min-width: 0; flex: 1; }
  .sign-row .v .mono { font-family: var(--mono); font-size: var(--fs-1); overflow-wrap: anywhere; }
  .sign-row .v .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .sign-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* a list of values typed one at a time: Enter or a comma adds, Backspace on an empty field pops */
  .chip-edit {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 34px; padding: 4px 6px;
    background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; cursor: text;
  }
  .chip-edit:focus-within { border-color: #3d4655; box-shadow: 0 0 0 3px var(--accent-soft); }
  .chip-edit input { flex: 1; min-width: 140px; height: 24px; border: 0; background: transparent; color: var(--text); font: inherit; font-size: var(--fs-2); padding: 0 4px; }
  .chip-edit input:focus { outline: none; }
  .chip-edit .pill { padding-right: 4px; }
  .chip-edit .pill button { display: inline-flex; width: 18px; height: 18px; align-items: center; justify-content: center; border: 0; border-radius: 999px; background: transparent; color: var(--dim); cursor: pointer; padding: 0; }
  .chip-edit .pill button:hover { color: var(--text); background: var(--surface-3); }
  .chip-edit .pill button svg { width: 12px; height: 12px; }
  .claim-label { font-size: var(--fs-1); color: var(--muted); margin-top: 2px; }
  /* a deep link scrolls a card group under the sticky header, not behind it */
  #settings-body > .stack { scroll-margin-top: 72px; }
  .sign-key { font: var(--fs-1) var(--mono); color: var(--muted); overflow-wrap: anywhere; flex: 1; min-width: 220px; }
  .sign-key b { color: var(--text); font-weight: 600; }
  .banner {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 8px;
    font-size: var(--fs-2); line-height: 1.5; border: 1px solid;
  }
  .banner.warn { color: #f2ce8a; border-color: rgba(214,160,50,.34); background: rgba(214,160,50,.08); }
  .banner.ok { color: #9fe3ad; border-color: rgba(70,185,92,.3); background: rgba(70,185,92,.07); }
  .banner.err { color: #ffa8a2; border-color: rgba(240,87,79,.32); background: rgba(240,87,79,.08); }
  .banner .ico { flex: none; margin-top: 1px; }
  .ico-svg { display: inline-flex; width: 1em; height: 1em; flex: none; vertical-align: -.125em; }
  .ico-svg svg, svg.ico-svg { display: block; width: 1em; height: 1em; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .back .ico-svg { margin-right: 6px; }
  .jump .ico-svg { margin-right: 4px; }
  .phase-ico .idle { opacity: .45; }
  .banner code { font-family: var(--mono); font-size: var(--fs-1); }
  .steps { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: var(--fs-2); line-height: 1.75; }
  .steps code, .steps kbd { font-family: var(--mono); font-size: var(--fs-1); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }

  /* --------------------------------------------------------------- mobile */
  .tabbar { display: none; }
  #start { min-width: 88px; }
  /* installed-app quirks */
  @media (display-mode: standalone) {
    .topbar { padding-top: env(safe-area-inset-top); }
    body { overscroll-behavior-y: contain; }
  }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(10px);
    background: var(--surface-3); border: 1px solid var(--line-2); padding: 8px 16px; border-radius: 10px;
    font-size: var(--fs-2); opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    box-shadow: 0 12px 34px rgba(0,0,0,.6); z-index: 60; max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 980px) {
    :root { --pad: 16px; }
    /* One column: the run first, then the sidebar with the facts and the commits. */
    .detail { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: start; }
    .sidebar { order: 2; position: static; height: auto; overflow: visible; border-right: 0; border-top: 1px solid var(--line); }
    .side-commits .commits { overflow: visible; min-height: 0; }  /* one scroll: the page */
    .options { grid-template-columns: 1fr; grid-auto-flow: row; }
    #opt-branch, #opt-arena, #opt-paths, #opt-timeout, #checks { grid-column: auto; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    :root { --pad: 14px; }
    /* one scale on a phone: 15 body, 13 controls, 12 metadata. Before this the
       page mixed 11.5, 12, 12.5, 13, and 14 in the same view */
    body { font-size: 15px; }
    .btn { font-size: 14px; }
    .pill { font-size: 12px; }
    .repo-name { font-size: 15px; }
    .hint, .opt-label .desc, .phase-sub, .run-foot .hint, .commit .meta { font-size: 12px; }
    .phase-head { padding: 10px 12px; font-size: 13px; }
    .commit { font-size: 13px; }
    .sign-fields { grid-template-columns: 1fr; }
    .sign-row .k { flex-basis: 100%; min-width: 0; }
    .run-foot { flex-wrap: wrap; }
    .logwrap .log { max-height: 52vh; }
    .topbar { height: 52px; gap: 8px; }
    /* the top bar is crowded on a phone: keep the brand on one line and drop
       the version chip (it lives in the title) */
    .brand .name { white-space: nowrap; }
    #ver { display: none; }
    .brand .name { font-size: 13.5px; }
    .env-dots span span, .env-dots .lbl { display: none; }
    .env-dots { gap: 8px; }
    .hero h1 { font-size: 19px; }
    /* stacked, the bar is not a frame any more: the field and the button
       stand on their own, so there is no box inside a box */
    .addbar { flex-direction: column; align-items: stretch; gap: 10px; padding: 0; border: 0; background: none; }
    .addbar:focus-within { box-shadow: none; }
    .addbar .field { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 8px; }
    .addbar .field:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 1px; }
    /* a 34px field is a desktop control; on a phone this box is the first
       thing you touch, so give it and its button a real touch target */
    /* flex:1 becomes flex-basis:0 on the main (vertical) axis once the row
       turns into a column, which silently overrides height - so opt out */
    /* below 16px iOS Safari zooms the page when a field takes focus */
    .field, .mono-field, input, select, textarea { font-size: 16px; }
    .addbar .field { flex: 0 0 auto; height: 48px; padding: 0 12px; }
    .addbar .btn { height: 48px; font-size: 15px; }
    #start { display: none; }  /* the tab bar carries the run controls on a phone */
    .main-col { padding: 12px; }
    .sidebar { padding-bottom: 88px; }
    .wrap { padding: 16px var(--pad) 88px; }
    .detail-head h1 { font-size: 15px; }
    .card-head { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 6px; }
    .log { font-size: 12px; }
    .log-row { grid-template-columns: 58px 38px minmax(0, 1fr); gap: 8px; padding: 0 12px; }
    .tabbar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      border-top: 1px solid var(--line); background: rgba(10, 12, 15, .94);
      backdrop-filter: blur(14px); padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      gap: 8px;
    }
    .tabbar .btn { flex: 1; height: 42px; }
    .console { min-height: 46vh; }

    /* 44px is the smallest thing a thumb hits reliably; the desktop sizes are
       tuned for a mouse, so the phone gets its own set */
    .icon-btn, .btn.ghost.rm { width: 44px; height: 44px; }
    .arena-row .prlink { min-height: 44px; }
    .btn, .btn.back { min-height: 44px; }
    .field, select.field { height: 44px; }
    .check { min-height: 44px; }
    .check input { width: 20px; height: 20px; }
    .check input::after { width: 15px; height: 15px; }
    .opt.row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 6px; }
    .slider { height: 44px; }
    .row-btn.select { min-height: 44px; }
    .link-btn { min-height: 44px; min-width: 44px; }
    .fold-head { min-height: 44px; }
    /* a grid instead of a ragged wrap: one column at 360 px, more on wider phones */
    .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0 12px; }
    .opt.row > label { grid-column: 1 / -1; }
    .tabbar .btn { height: 46px; font-size: 15px; }
    .chip-x { padding: 4px 4px 4px 10px; }
    .chip-x button { padding: 4px 6px; }
    .chips { min-height: 44px; padding: 0 6px; }
    .chips input { height: auto; min-height: 44px; font-size: 16px; }
    .tree-row { min-height: 44px; }
    .tree-select { min-width: 44px; min-height: 44px; justify-content: center; }

    /* one scale, enforced: 12 metadata, 13 note, 14 control, 15 body,
       16 field, 19 page title. Anything with its own desktop size is
       pinned here, after every other rule. */
    .pill, .pill.mono, .chip, .bname, .arena-row .bname, .hint, .card-head .hint,
    .arena-row, .phase-sub, .commit .meta, .sign-key, .kv dt, .kv dd, .log-row,
    .env-dots, .run-foot .hint, .steps, .steps code, .steps kbd { font-size: 12px; }
    .banner, .toast, .wrap h2, .card-head h2, .skip, .steps,
    .opt.row > label, .phase-name, .check { font-size: 13px; }
    .status, #statustext, .phase-ico, .commit .sig, .commit .sha { font-size: 12px; }
    .brand .name, .repo-card .btn, .card-actions .btn, .run-foot .btn { font-size: 14px; }
    .wrap h1, .hero h1, .wrap h1.page-title { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="app">
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="arena-cleanup, back to the dashboard">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M8.3 1.6 16.4 9.7a1 1 0 0 1 0 1.4l-5.3 5.3a1 1 0 0 1-1.4 0L1.6 8.3A1 1 0 0 1 1.3 7.6V2.3a1 1 0 0 1 1-1h5.3a1 1 0 0 1 .7.3Z" fill="#6e79d6"/>
        <circle cx="5.4" cy="5.4" r="1.5" fill="#08090b"/>
        <path d="M9.2 12.6l1.5 1.5 3.1-3.7" stroke="#0a0b0e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="name">arena-cleanup</span>
      <span class="chip" id="ver">v?</span>
    </a>
    <div class="grow"></div>
    <div class="env-dots" id="env"></div>
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
      <span class="ico-svg" data-icon="settings" aria-hidden="true"></span>
    </button>
  </header>

  <main id="main" tabindex="-1">
  <!-- =========================================================== dashboard -->
  <div class="view" id="view-dashboard">
    <div class="wrap">
      <div class="hero">
        <h1 tabindex="-1">Repos</h1>
      </div>

      <div id="offline-banner" hidden></div>
      <div id="auth-banner" hidden></div>

      <div class="addbar">
        <input class="field mono-field" id="add-source" spellcheck="false" autocomplete="off"
               placeholder="Paste a repo URL…" aria-label="Repo URL">
        <button class="btn primary" id="add-btn">Add repo</button>
      </div>
      <p class="field-error" id="add-error" role="alert" hidden></p>

      <div class="grid" id="repo-grid"></div>
      <div class="empty-state" id="repo-empty" hidden>
        <strong>No repos yet</strong>
        <span>Paste a repo URL above to clone it into this instance.</span>
      </div>
    </div>
  </div>

  <!-- ============================================================ repo view -->
  <div class="view" id="view-repo" hidden>
    <div class="detail">
      <aside class="sidebar" id="sidebar">
        <div class="side-top" id="side-top"></div>
        <section class="side-group side-commits" id="commits-card">
          <div class="side-label">
            <span>Commits <span class="hint" id="commits-hint"></span></span>
            <button class="btn ghost" id="commits-refresh">Reload</button>
          </div>
          <div class="commits" id="commits"></div>
        </section>
      </aside>
      <div class="main-col">
        <div class="detail-head">
          <button class="btn ghost back" id="back"><span class="ico-svg" data-icon="arrow-left" aria-hidden="true"></span>All repos</button>
          <h1 id="repo-title">…</h1>
        </div>

        <section class="card" id="options-card">
          <button type="button" class="card-head fold-head" id="options-fold" aria-expanded="true" aria-controls="options">
            <span class="fold-title">Options</span>
            <span class="pill mono" id="branch-now">current</span>
            <span class="hint" id="options-sum">defaults</span>
            <span class="grow"></span>
            <span class="caret"><span class="ico-svg" data-icon="chevron-right" aria-hidden="true"></span></span>
          </button>
          <div class="card-body options" id="options">
            <div class="opt row" id="opt-branch">
              <label for="branch">Target branch</label>
              <select class="field mono-field" id="branch" title="The default branch runs via the arena branch. A named branch is cleaned in place."></select>
            </div>
            <div class="opt row" id="opt-arena" hidden>
              <label for="arena">Arena branch</label>
              <select class="field mono-field" id="arena" title="The session this run cleans, newest activity first."></select>
            </div>
            <div class="opt row" id="opt-paths">
              <label for="pathin">Remove paths</label>
              <div class="chips" id="chips" title="git filter-repo removes each path from every ref.">
                <input id="pathin" placeholder="add a file or folder…" spellcheck="false" autocomplete="off" aria-label="Add a path to remove">
              </div>
              <button type="button" class="link-btn" id="browse" aria-expanded="false" aria-controls="tree">Browse</button>
              <div class="tree" id="tree" role="tree" aria-label="Files at HEAD" hidden></div>
            </div>
            <div class="opt row" id="opt-timeout">
              <label for="timeout">PR check timeout</label>
              <input class="slider" id="timeout" type="range" min="0" max="9" step="1" value="3" title="How long the run waits for the pull request checks; 0 does not wait.">
              <output class="readout" id="timeout-out" for="timeout">15 min</output>
            </div>
            <div class="opt checks" id="checks">
              <label class="check" title="Prints every step it would take and writes nothing."><input type="checkbox" data-opt="dry_run">Dry Run</label>
              <label class="check" title="Publishes even when the pull request still has running or failing checks."><input type="checkbox" data-opt="skip_pr_check">Ignore PR Checks</label>
              <label class="check" title="Keeps commits that would be empty once the removed paths are gone."><input type="checkbox" data-opt="keep_empty">Keep Empty Commits</label>
              <label class="check" title="Moves the tags to the rewritten commits. Unchecked, they stay on the old ones."><input type="checkbox" data-opt="update_tags" checked>Update Tags</label>
              <label class="check danger" title="Pushes even when the push would drop commits that are on the default branch."><input type="checkbox" data-opt="force">Force Push</label>
            </div>
          </div>
        </section>

        <section class="card console" id="console-card">
          <div class="card-head">
            <span class="status" id="status" role="status" aria-live="polite"><span class="led"></span><span id="statustext">idle</span></span>
            <div class="grow"></div>
            <button class="btn primary" id="start">Clean &amp; Push</button>
            <button class="btn" id="cancel" disabled>Cancel</button>
          </div>
          <ol class="phases" id="phases"></ol>
          <div class="run-foot">
            <button class="btn ghost" id="logtoggle" aria-expanded="false" aria-controls="logwrap">Show log</button>
            <span class="hint" id="logmeta"></span>
            <div class="grow"></div>
            <button class="btn ghost" id="copy">Copy log</button>
          </div>
          <div class="logwrap" id="logwrap" hidden>
            <div class="log" id="log" role="log" aria-live="polite" aria-relevant="additions"></div>
            <button class="jump" id="jump"><span class="ico-svg" data-icon="arrow-down" aria-hidden="true"></span>latest</button>
          </div>
        </section>
      </div>
    </div>
    <div class="tabbar" id="tabbar">
      <button class="btn primary" id="start-mobile">Clean &amp; Push</button>
      <button class="btn" id="cancel-mobile" disabled>Cancel</button>
    </div>
  </div>

  <!-- ============================================================= settings -->
  <!-- One page for every per-machine setting: identity, GitHub access, signing, claim
       rules. About sits below them. -->
  <div class="view" id="view-settings" hidden>
    <div class="wrap" style="max-width:760px">
      <div class="detail-head" style="margin-bottom:16px">
        <button class="btn ghost back" id="settings-back"><span class="ico-svg" data-icon="arrow-left" aria-hidden="true"></span>Back</button>
        <h1 class="page-title" tabindex="-1">Settings</h1>
      </div>
      <div id="settings-body" class="stack">
        <div id="identity-body" class="stack"></div>
        <div id="access-body" class="stack"></div>
        <div id="signing-body" class="stack"></div>
        <div id="claims-body" class="stack"></div>
        <div id="info-body" class="stack"></div>
      </div>
    </div>
  </div>
  </main>
</div>


<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) node.setAttribute(k, v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return node;
  };

  const state = {
    repos: [],
    repo: null,
    opts: { dry_run: false, skip_pr_check: false, keep_empty: false, no_tags: false, force: false },
    paths: [],
    branch: "",
    arena: "",
    job: null,
    es: null,
    phases: [],
    phase: null,
    signing: null,
  };

  // Lucide 1.61.0 glyphs, ISC licence in LICENSE-lucide.txt beside this file. One
  // glyph per name on its 24 px grid, drawn at 1em in the text color.
  const svg = (inner) => `<svg viewBox="0 0 24 24">${inner}</svg>`;
  const paths = (...ds) => ds.map((d) => `<path d="${d}"/>`).join("");
  const ICONS = {
    "arrow-left": svg(paths("m12 19-7-7 7-7", "M19 12H5")),
    settings: svg(paths("M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915") + '<circle cx="12" cy="12" r="3"/>'),
    "arrow-up": svg(paths("m5 12 7-7 7 7", "M12 19V5")),
    "arrow-down": svg(paths("M12 5v14", "m19 12-7 7-7-7")),
    "chevron-right": svg(paths("m9 18 6-6-6-6")),
    folder: svg(paths("M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z")),
    file: svg(paths("M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z", "M14 2v5a1 1 0 0 0 1 1h5")),
    plus: svg(paths("M5 12h14", "M12 5v14")),
    check: svg(paths("M20 6 9 17l-5-5")),
    x: svg(paths("M18 6 6 18", "m6 6 12 12")),
    "triangle-alert": svg(paths("m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3", "M12 9v4", "M12 17h.01")),
    minus: svg(paths("M5 12h14")),
    "circle-small": svg('<circle cx="12" cy="12" r="6"/>'),
    "loader-circle": svg(paths("M21 12a9 9 0 1 1-6.219-8.56")),
    "git-branch": svg(paths("M15 6a9 9 0 0 0-9 9V3") + '<circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>'),
  };
  function icon(name, cls = "ico-svg") {
    const box = el("span", { class: cls, "aria-hidden": "true" });
    box.innerHTML = ICONS[name] || "";
    return box;
  }
  for (const slot of document.querySelectorAll("[data-icon]")) slot.innerHTML = ICONS[slot.dataset.icon] || "";

  const toast = (msg) => {
    const node = $("toast");
    node.textContent = msg;
    node.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => node.classList.remove("show"), 2200);
  };

  async function api(path, init) {
    const res = await fetch(path, init);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || res.statusText);
    return body;
  }
  const post = (path, body) =>
    api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });

  // ------------------------------------------------------------------ views
  // The address bar is the state: refresh, Back, and Forward all land on the
  // screen they expect, and a repo view can be bookmarked or sent to someone.
  function hashFor(view) {
    if (view === "repo") return "#/repo/" + (state.repo?.id || "");
    return { dashboard: "#/", settings: "#/settings" }[view] || "#/";
  }

  // The dashboard tab reads "arena-cleanup", the other pages "arena-cleanup | <page>".
  // One setter, called from every path that changes the view or the open repo.
  function titleFor(view) {
    const page = view === "repo" && state.repo ? state.repo.name : view === "settings" ? "Settings" : "";
    return page ? `arena-cleanup | ${page}` : "arena-cleanup";
  }

  function syncTitle() {
    document.title = titleFor(state.view);
  }

  function show(view) {
    for (const name of ["dashboard", "repo", "settings"]) {
      $("view-" + name).hidden = name !== view;
    }
    // remember where we are, so a sub-view can send you back to the place you
    // actually came from instead of guessing from whatever was open last
    state.view = view;
    syncTitle();
    navigate(hashFor(view));
    window.scrollTo(0, 0);
    // keyboard and screen-reader users land on the new screen, not back at
    // the top of the document
    const panel = $("view-" + view);
    // focus the heading, not the Back button: a heading cannot be re-activated
    // by the Enter key that got you here, which a focused button can
    const heading = panel.querySelector("h1, h2");
    if (heading) heading.focus({ preventScroll: true });
  }

  // The history stays shallow: the dashboard is the root entry and a sub-view
  // is at most one entry deep. One Back leaves a sub-view, the next one leaves
  // the page. Entries this page pushed carry a marker; a deep link has none.
  function navigate(want) {
    const here = location.hash || "#/";
    if (here === want) return;
    const pushed = Boolean(history.state && history.state.arena);
    if (want === "#/") {
      if (pushed) history.back();
      else history.replaceState(null, "", want);
    } else if (pushed) {
      history.replaceState({ arena: 1 }, "", want);
    } else {
      history.pushState({ arena: 1 }, "", want);
    }
  }

  // Translate a hash into a screen. Used on load and on Back/Forward.
  async function applyHash() {
    const hash = location.hash || "#/";
    if (hash === "#/settings") return openSettings();
    const match = hash.match(/^#\/repo\/([^/]+)$/);
    if (match && state.repos.some((r) => r.id === match[1])) return openRepo(match[1]);
    state.repo = null;
    show("dashboard");
    await loadRepos();
  }

  // Back from a sub-view: return to the screen that opened it.
  function goBack() {
    // a repo closed behind the settings view cannot be returned to
    show(state.returnTo === "repo" && state.repo ? "repo" : "dashboard");
  }

  // -------------------------------------------------------------- dashboard
  // the commits an arena branch carries beyond the default branch
  function aheadPill(n, base, cls = "pill mono ahead") {
    const count = Number(n ?? 0);
    const title = `${count} commit${count === 1 ? "" : "s"} ahead of origin/${base}`;
    return el("span", { class: cls, title }, icon("arrow-up"), el("span", { class: "n" }, String(count)));
  }

  function checksPill(pr, checked, reason) {
    if (!pr && checked === false) {
      return el("span", {
        class: "pill warn",
        title: reason || "gh is not signed in, so pull requests and their checks cannot be read",
      }, "checks unavailable");
    }
    if (!pr) return el("span", { class: "pill mono" }, "no PR");
    const cls = pr.state === "passing" ? "ok" : pr.state === "failing" ? "err" : pr.state === "running" ? "run" : "mono";
    if (pr.state === "none") return el("span", { class: "pill mono" }, `PR #${pr.number}, no checks`);
    return el("span", { class: "pill " + cls, title: pr.title },
      el("i", { class: "dot" }),
      `PR #${pr.number}`,
      `, ${pr.passed}/${pr.total}`);
  }

  // Removing a card deletes its URL clone, so the first click only arms the
  // button; the second confirms. No browser modal, and it works on a phone.
  function removeButton(repo) {
    let timer = 0;
    const disarm = () => { btn.classList.remove("armed"); btn.replaceChildren(icon("x")); btn.setAttribute("aria-label", `Remove ${repo.name}`); };
    const btn = el("button", {
      class: "btn ghost rm", title: "Remove this repo", "aria-label": `Remove ${repo.name}`,
      onclick: async (e) => {
        e.stopPropagation();
        if (!btn.classList.contains("armed")) {
          btn.classList.add("armed");
          btn.textContent = "Remove?";
          btn.setAttribute("aria-label", `Confirm removing ${repo.name}`);
          timer = setTimeout(disarm, 4000);
          return;
        }
        clearTimeout(timer);
        try {
          await post(`/api/repos/${repo.id}/remove`, { delete: true });
          toast("removed");
          loadRepos();
        } catch (err) { toast(err.message); disarm(); }
      },
    }, icon("x"));
    return btn;
  }

  function repoCard(repo) {
    const s = repo.status || {};
    const head = el("div", { class: "repo-head" },
      el("span", { class: "repo-ico", "aria-hidden": "true" }, icon("git-branch")),
      el("div", { style: "min-width:0" },
        el("div", { class: "repo-name" }, repo.name)),
      removeButton(repo));

    const meta = el("div", { class: "repo-meta" });
    if (!s.ok) {
      meta.append(el("span", { class: "pill err" }, el("i", { class: "dot" }), s.reason || "unavailable"));
    } else {
      meta.append(el("span", { class: "pill mono" }, s.branch));
    }

    let arena = null;
    if (s.ok) {
      arena = el("div", { class: "arena-list" });
      if (!s.arena.length) {
        arena.append(el("div", { class: "arena-row", style: "color:var(--dim)" }, "no arena/* branches on origin"));
      } else {
        for (const name of s.arena.slice(0, 3)) {
          const pr = (s.pr || {})[name];
          arena.append(el("div", { class: "arena-row" },
            el("i", { class: "dot", style: `background:${pr ? (pr.state === 'passing' ? 'var(--ok)' : pr.state === 'failing' ? 'var(--err)' : 'var(--info)') : 'var(--line-2)'};margin-left:2px` }),
            el("span", { class: "bname" }, name),
            aheadPill((s.ahead || {})[name], s.default),
            pr && pr.url
              ? el("a", { class: "prlink", href: pr.url, target: "_blank", rel: "noopener",
                  title: `Open pull request ${pr.number ? "#" + pr.number : ""} on GitHub`,
                  "aria-label": `Open pull request ${pr.number ? "#" + pr.number : ""} on GitHub`,
                  onclick: (e) => e.stopPropagation() },
                  checksPill(pr, s.pr_checked, s.pr_reason))
              : checksPill(pr, s.pr_checked, s.pr_reason)));
        }
      }
    }

    const actions = el("div", { class: "card-actions" },
      el("button", { class: "btn primary", onclick: async (e) => { e.stopPropagation(); await oneClick(repo); } }, "Clean & Push"));

    return el("div", { class: "repo-card", role: "button", tabindex: "0",
        onclick: () => openRepo(repo.id),
        onkeydown: (e) => { if (e.key === "Enter") openRepo(repo.id); } },
      head, meta, arena, actions);
  }

  async function loadRepos() {
    if (!state.auth) await refreshAuth();
    try {
      state.repos = await api("/api/repos");
      state.unreachable = false;
    } catch (err) {
      // "no repos" and "cannot ask the server" look identical on screen
      // unless we keep them apart - and an empty dashboard here would be a lie
      state.repos = [];
      state.unreachable = true;
    }
    const grid = $("repo-grid");
    grid.replaceChildren(...state.repos.map(repoCard));
    $("repo-empty").hidden = state.unreachable || state.repos.length > 0;
    grid.hidden = state.unreachable;
    const box = $("offline-banner");
    box.hidden = !state.unreachable;
    if (state.unreachable) {
      box.replaceChildren(el("div", { class: "banner err", style: "margin-bottom:16px" },
        el("span", { class: "ico" }, icon("triangle-alert")),
        el("div", { style: "flex:1" },
          el("b", {}, "Cannot reach the server."),
          " Every button here changes a git repo, so nothing is cached. Check that the container is running, then retry.",
          el("div", { style: "margin-top:8px" },
            el("button", { class: "btn ghost", id: "retry", onclick: () => loadRepos() }, "Retry")))));
    }
  }

  // the add bar reports a bad source under the field, not in a toast
  function addError(message) {
    const input = $("add-source");
    const note = $("add-error");
    note.textContent = message;
    note.hidden = !message;
    if (message) {
      input.setAttribute("aria-invalid", "true");
      input.setAttribute("aria-describedby", "add-error");
    } else {
      input.removeAttribute("aria-invalid");
      input.removeAttribute("aria-describedby");
    }
  }

  async function addRepo() {
    const input = $("add-source");
    const source = input.value.trim();
    if (!source) return;
    if (!/^(git@|ssh:|git:|https?:|(www\.)?github\.com\/)/i.test(source)) {
      addError("Use a git URL: https://host/owner/repo.git, git@host:owner/repo.git, or github.com/owner/repo");
      input.focus();
      return;
    }
    const btn = $("add-btn");
    btn.disabled = true;
    btn.textContent = "Cloning…";
    try {
      const repo = await post("/api/repos", { source });
      input.value = "";
      toast(`added ${repo.name}`);
      await loadRepos();
      openRepo(repo.id);
    } catch (err) {
      toast(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Add repo";
    }
  }

  // ------------------------------------------------------------- repo view
  function openRepo(id) {
    const repo = state.repos.find((r) => r.id === id);
    if (!repo) return;
    state.repo = repo;
    state.branch = "";
    state.arena = "";
    state.paths = [];
    closeTree();
    $("repo-title").textContent = repo.name;
    renderBranchSelect();
    renderArenaSelect();
    renderSidebar();
    renderPaths();
    renderCommand();
    resetPhases();
    setStatus("", "idle");
    $("log").replaceChildren();
    $("logmeta").textContent = "";
    setLogOpen(false);
    show("repo");
    refreshStatus();
    loadCommits();
  }

  function dotFor(pr) {
    if (!pr) return "var(--line-2)";
    return pr.state === "passing" ? "var(--ok)" : pr.state === "failing" ? "var(--err)" : "var(--info)";
  }
  function metaFor(pr, checked) {
    if (!pr) return checked === false ? "cannot check" : "no PR";
    if (pr.failed) return `#${pr.number}, ${pr.failed} failing`;
    if (pr.running) return `#${pr.number}, ${pr.running} running`;
    return `#${pr.number}, ${pr.passed}/${pr.total}`;
  }

  function renderSidebar() {
    const s = state.repo?.status || {};
    const side = $("side-top");
    const kv = el("dl", { class: "kv" });
    const add = (k, v, mono) => { kv.append(el("dt", {}, k), el("dd", { class: mono ? "mono" : "" }, v ?? "…")); };
    add("branch", s.branch, false);
    add("default", s.default, false);
    add("changes", s.dirty ? `${s.dirty} uncommitted` : "clean", false);
    add("remote", s.remote || "not set", true);

    const branches = el("div", { class: "side-group" },
      el("div", { class: "side-label" }, "Arena branches", el("span", {}, String((s.arena || []).length))),
      ...((s.arena && s.arena.length)
        ? s.arena.map((b) => el("button", { type: "button", class: "row-btn select", "data-branch": b,
             "aria-pressed": String(selectedArena(s) === b), "aria-label": `Pull from ${b}`,
             title: "Pull from this arena branch",
             onclick: () => selectArena(b) },
             el("i", { class: "dot", style: `background:${dotFor((s.pr || {})[b])}` }),
             el("span", { class: "txt" }, b),
             el("span", { class: "tail" },
               aheadPill((s.ahead || {})[b], s.default, "meta ahead"),
               el("span", { class: "meta" }, metaFor((s.pr || {})[b], s.pr_checked)))))
        : [el("div", { class: "row-btn", style: "cursor:default;color:var(--dim)" }, el("span", { class: "txt" }, "none on origin"))]));

    side.replaceChildren(
      el("div", { class: "side-group" }, el("div", { class: "side-label" }, "Repo"), kv),
      branches);
  }

  // The run pulls from the selected arena branch. With one branch there is
  // nothing to choose, so its row only shows which branch that is.
  function selectedArena(s) {
    if (state.arena) return state.arena;
    const names = s.arena || [];
    return names.length === 1 ? names[0] : "";
  }

  function selectArena(name) {
    if ((state.repo?.status?.arena || []).length >= 2 && name !== state.arena) {
      state.arena = name;
      $("arena").value = name;
      renderCommand();
    }
    renderSidebar();
  }

  function renderBranchSelect() {
    const s = state.repo?.status || {};
    const main = s.default || s.branch || "?";
    const onDefault = !s.branch || s.branch === main;
    // The default branch leads: a run on it finds the arena branch itself, so
    // the value stays empty. A clone parked on another branch keeps that
    // branch as "current" and offers the default branch cleaned in place.
    const options = [el("option", { value: onDefault ? "" : main }, `${main} (default)`)];
    if (!onDefault) options.push(el("option", { value: "" }, `current (${s.branch})`));
    $("branch").replaceChildren(...options);
    $("branch").value = state.branch;
  }

  // With one arena branch the run finds it; with several the page selects the
  // newest tip and offers the rest, so the engine never has to ask.
  function renderArenaSelect() {
    const s = state.repo?.status || {};
    const activity = s.activity || {};
    const names = [...(s.arena || [])].sort((a, b) => (activity[b] || 0) - (activity[a] || 0));
    const several = names.length >= 2;
    $("opt-arena").hidden = !several;
    state.arena = several ? (names.includes(state.arena) ? state.arena : names[0]) : "";
    $("arena").replaceChildren(...names.map((name) => el("option",
      { value: name, title: `${name}, last activity ${when(activity[name] * 1000)}` },
      `${name} · ${when(activity[name] * 1000, false)}`)));
    $("arena").value = state.arena;
  }

  async function refreshStatus() {
    if (!state.repo) return;
    try {
      const repo = await api(`/api/repos/${state.repo.id}`);
      const kept = state.repo;
      state.repo = repo;
      if (state.repos.find((r) => r.id === repo.id)) {
        state.repos = state.repos.map((r) => (r.id === repo.id ? repo : r));
      }
      if (!$("view-repo").hidden) {
        $("repo-title").textContent = repo.name;
        syncTitle();
        renderBranchSelect();
        renderArenaSelect();
        renderSidebar();
      }
    } catch { /* keep the last good view */ }
  }

  function renderPaths() {
    const box = $("chips");
    for (const node of [...box.querySelectorAll(".chip-x")]) node.remove();
    for (const p of state.paths) {
      const chip = el("span", { class: "chip-x" }, el("span", {}, p),
        el("button", { "aria-label": "remove", onclick: () => {
          state.paths = state.paths.filter((x) => x !== p);
          renderPaths();
          renderCommand();
        } }, icon("x")));
      box.insertBefore(chip, $("pathin"));
    }
    for (const btn of $("tree").querySelectorAll(".tree-select")) {
      const on = state.paths.includes(btn.closest(".tree-row").dataset.path);
      btn.setAttribute("aria-pressed", String(on));
      btn.replaceChildren(icon(on ? "check" : "plus"));
    }
  }

  // -- Path tree: the HEAD tree of the open repo, one level per request
  function closeTree() {
    $("tree").hidden = true;
    $("tree").replaceChildren();
    $("browse").setAttribute("aria-expanded", "false");
  }

  function togglePath(path) {
    state.paths = state.paths.includes(path) ? state.paths.filter((x) => x !== path) : [...state.paths, path];
    renderPaths();
    renderCommand();
  }

  async function treeLevel(container, rel, depth) {
    const query = rel ? `?path=${encodeURIComponent(rel)}` : "";
    const data = await api(`/api/repos/${state.repo.id}/tree${query}`);
    container.replaceChildren(...data.entries.map((entry) =>
      treeRow(entry, rel ? `${rel}/${entry.name}` : entry.name, depth)));
    if (!data.entries.length) container.append(el("div", { class: "tree-empty" }, "empty"));
    renderPaths();
  }

  function treeRow(entry, path, depth) {
    const dir = entry.type === "dir";
    const row = el("div", { class: "tree-row", role: "treeitem", tabindex: "0", "aria-level": String(depth),
        "data-path": path, style: `--depth:${depth}`,
        onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); row.click(); } } },
      el("span", { class: "tree-caret" }, dir ? icon("chevron-right") : ""),
      el("span", { class: "tree-ico" }, icon(dir ? "folder" : "file")),
      el("span", { class: "tree-name" }, entry.name),
      el("button", { type: "button", class: "tree-select", "aria-label": `Remove ${path}`, "aria-pressed": "false",
        onclick: (e) => { e.stopPropagation(); togglePath(path); } }, icon("plus")));
    const node = el("div", { class: "tree-node" }, row);
    if (!dir) {
      row.onclick = () => togglePath(path);
      return node;
    }
    let kids = null;
    row.setAttribute("aria-expanded", "false");
    row.onclick = async () => {
      const open = row.getAttribute("aria-expanded") === "true";
      row.setAttribute("aria-expanded", String(!open));
      if (open) { kids.hidden = true; return; }
      if (!kids) {
        kids = el("div", { class: "tree-kids", role: "group" });
        node.append(kids);
        try { await treeLevel(kids, path, depth + 1); } catch (err) { toast(err.message); }
      }
      kids.hidden = false;
    };
    return node;
  }

  function payload() {
    return {
      action: "run",
      paths: state.paths,
      dry_run: state.opts.dry_run,
      keep_empty: state.opts.keep_empty,
      branch: state.branch || "",
      arena: state.arena || "",
      force: state.opts.force,
      skip_pr_check: state.opts.skip_pr_check,
      no_tags: state.opts.no_tags,
      timeout: String(timeoutMinutes()),
    };
  }

  // The slider snaps to these stops; its value is the index.
  const TIMEOUT_STOPS = [0, 5, 10, 15, 20, 30, 45, 60, 90, 120];
  const DEFAULT_TIMEOUT = 15;
  function timeoutMinutes() {
    return TIMEOUT_STOPS[Number($("timeout").value)] ?? DEFAULT_TIMEOUT;
  }

  function commandLine() {
    const body = payload();
    const parts = ["run"];
    if (body.dry_run) parts.push("--dry-run");
    if (state.branch) parts.push("--branch", state.branch);
    if (state.arena) parts.push("--arena", state.arena);
    for (const p of state.paths) parts.push("--path", p);
    if (body.keep_empty) parts.push("--keep-empty");
    if (body.skip_pr_check) parts.push("--skip-pr-check");
    if (body.no_tags) parts.push("--no-tags");
    if (body.force) parts.push("--force");
    parts.push("--check-timeout", String(timeoutMinutes() * 60));
    return parts.join(" ");
  }

  const SUMMARY_WORDS = [
    ["dry_run", "dry run"], ["skip_pr_check", "ignore PR checks"], ["keep_empty", "keep empty"],
    ["no_tags", "tags stay"], ["force", "force push"],
  ];

  function optionsSummary() {
    const body = payload();
    const bits = [];
    if (state.arena) bits.push(state.arena);
    if (state.paths.length) bits.push(`${state.paths.length} path${state.paths.length === 1 ? "" : "s"}`);
    for (const [key, word] of SUMMARY_WORDS) if (body[key]) bits.push(word);
    const minutes = timeoutMinutes();
    if (minutes !== DEFAULT_TIMEOUT) bits.push(`${minutes} min`);
    return bits.length ? bits.join(" · ") : "defaults";
  }

  function renderCommand() {
    const line = commandLine();
    for (const id of ["start", "start-mobile"]) {
      $(id).title = `Runs: ${line}`;
      $(id).dataset.argv = line;
    }
    $("options-sum").textContent = optionsSummary();
    $("branch-now").textContent = $("branch").selectedOptions[0]?.textContent || "?";
  }

  // ------------------------------------------------------------------- jobs
  // ------------------------------------------------------------ run stages
  // GitHub's run view, not a wall of text: one row per stage, ticked off as
  // the engine reaches it, and the raw log one click away.
  const PHASES = [
    { id: "prepare", name: "Prepare", sub: "fetch, branches, checkout" },
    { id: "pr", name: "PR checks", sub: "read the pull request" },
    { id: "rewrite", name: "Rewrite and sign", sub: "claim, trim, sign" },
    { id: "publish", name: "Publish", sub: "push, tags, cleanup" },
    { id: "sync", name: "Finish", sub: "back to the default branch" },
  ];
  const PHASE_TESTS = [
    ["prepare", /^arena-cleanup \d|^claimed |^dry run:/],
    ["pr", /(^|\s)pr\b|pull request|check|gate|status rollup/],
    ["rewrite", /rewrit|claim|sign|filter-repo|remov|empty commit|--path|identity=/],
    ["publish", /push|tag|lease|force/],
    ["sync", /return|delet|done|nothing to publish|finished|cleanup/],
    ["prepare", /fetch|branch|switch|checkout|scan|stale|pull|prune|starting/],
  ];

  function msgOf(text) {
    const match = /^\d{4}-\d\d-\d\dT\S+\s+(?:INFO|OK|WARN|ERROR|DEBUG)\s+(.*)$/.exec(text);
    return (match ? match[1] : text).toLowerCase();
  }

  function phaseFor(text) {
    const msg = msgOf(text);
    for (const [id, re] of PHASE_TESTS) if (re.test(msg)) return id;
    return null;
  }

  function resetPhases() {
    state.phases = PHASES.map((p) => ({ ...p, state: "idle", lines: 0, start: 0, end: 0 }));
    state.phase = "prepare";
    $("phases").replaceChildren(...state.phases.map((p) =>
      el("li", { class: "phase", "data-phase": p.id, "data-state": "idle" },
        el("div", { class: "phase-head" },
          el("span", { class: "phase-ico", "aria-hidden": "true" }, icon("circle-small", "ico-svg idle")),
          el("span", { class: "phase-name" }, p.name),
          el("span", { class: "phase-sub" }, p.sub),
          el("span", { class: "phase-time" })))));
  }

  function phaseNode(id) {
    return document.querySelector(`.phase[data-phase="${id}"]`);
  }

  function paintPhase(p) {
    const node = phaseNode(p.id);
    if (!node) return;
    node.dataset.state = p.state;
    node.querySelector(".phase-ico").replaceChildren(
      icon({ done: "check", fail: "x", run: "loader-circle", skip: "minus" }[p.state] || "circle-small",
        p.state === "idle" ? "ico-svg idle" : "ico-svg"));
    node.querySelector(".phase-sub").textContent = p.sub;
    const secs = p.start && p.end ? p.end - p.start : 0;
    const done = p.state === "done" || p.state === "fail";
    node.querySelector(".phase-time").textContent =
      p.state === "run" ? "running" : done ? (secs < 0.1 ? "<0.1s" : secs.toFixed(1) + "s") : "";
    node.setAttribute(
      "aria-label", `${p.name}: ${p.state === "idle" ? "not started" : p.state}${p.sub ? ", " + p.sub : ""}`);
  }

  function markEarlierDone(id) {
    const upto = PHASES.findIndex((p) => p.id === id);
    for (const p of state.phases) {
      const at = PHASES.findIndex((x) => x.id === p.id);
      if (at < upto && p.state === "run") p.state = "done";
      paintPhase(p);
    }
  }

  function finishPhases(ok, cancelled) {
    const last = state.phases.find((p) => p.id === state.phase) || state.phases[0];
    for (const p of state.phases) {
      if (p.state === "run") p.state = p === last && !ok && !cancelled ? "fail" : "done";
      if (p.state === "idle") p.state = "skip";
      paintPhase(p);
    }
  }

  function lineCount() {
    return state.phases.reduce((n, p) => n + p.lines, 0);
  }

  function clock(stamp) {
    // the engine stamps a line in the server zone; the row shows the browser's
    const d = new Date(stamp);
    if (Number.isNaN(d.getTime())) return stamp.slice(11, 19);
    return [d.getHours(), d.getMinutes(), d.getSeconds()]
      .map((n) => String(n).padStart(2, "0")).join(":");
  }

  function classify(text) {
    const match = /^(\d{4}-\d\d-\d\dT\S+)\s+(INFO|OK|WARN|ERROR|DEBUG)\s+(.*)$/.exec(text);
    if (match) {
      const level = match[2].toLowerCase();
      return el("div", { class: "log-row " + (level === "debug" ? "info" : level) },
        el("span", { class: "t" }, clock(match[1])),
        el("span", { class: "lv" }, match[2]),
        el("span", { class: "msg" }, match[3]));
    }
    if (/^\s{2,}\S/.test(text)) {
      return el("div", { class: "log-row cont" },
        el("span", {}), el("span", {}), el("span", { class: "msg" }, text));
    }
    return el("div", { class: "log-row" },
      el("span", {}),
      el("span", { class: "msg", style: "grid-column:2/-1;color:var(--muted)" }, text));
  }

  function appendLines(lines) {
    if (!lines.length) return;
    const log = $("log");
    const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 70;
    for (const line of lines) {
      const text = line.text ?? "";
      const node = classify(text);
      log.append(node);
      const id = phaseFor(text) || state.phase || "prepare";
      state.phase = id;
      const phase = state.phases.find((p) => p.id === id);
      if (!phase) continue;
      phase.lines += 1;
      phase.start = phase.start || line.t || Date.now() / 1000;
      phase.end = line.t || phase.end || Date.now() / 1000;
      if (/^ok\b/i.test(msgOf(text)) || / done\b/.test(msgOf(text))) {
        // a short status line for the row, so the list says what happened
        phase.sub = text.replace(/^.*?\s(?:INFO|OK|WARN|ERROR)\s+/, "").slice(0, 64);
      }
      if (phase.state === "idle") phase.state = "run";
      markEarlierDone(id);
    }
    $("logmeta").textContent = `${lineCount()} lines`;
    if (nearBottom && !$("logwrap").hidden) log.scrollTop = log.scrollHeight;
    $("jump").classList.toggle("show", !nearBottom && log.scrollHeight > log.clientHeight);
  }

  function setStatus(level, text) {
    $("status").className = "status" + (level ? " " + level : "");
    $("statustext").textContent = text;
  }

  function setLogOpen(open) {
    $("logwrap").hidden = !open;
    $("logtoggle").setAttribute("aria-expanded", String(open));
    $("logtoggle").textContent = open ? "Hide log" : "Show log";
    if (open) {
      const log = $("log");
      log.scrollTop = log.scrollHeight;
      $("jump").classList.remove("show");
    }
  }

  async function startJob(body) {
    if (state.job || !state.repo) return;
    $("log").replaceChildren();
    resetPhases();
    setStatus("running", "starting");
    setStartEnabled(false);
    try {
      const job = await post(`/api/repos/${state.repo.id}/jobs`, body);
      state.job = job.id;
      setStatus("running", "running");
      follow(job.id);
    } catch (err) {
      setStatus("fail", "error");
      setLogOpen(true);
      appendLines([{ text: err.message }]);
      setStartEnabled(true);
      state.job = null;
    }
  }

  const setStartEnabled = (on) => {
    for (const id of ["start", "start-mobile"]) {
      $(id).disabled = !on;
      $(id).classList.toggle("busy", !on);
    }
    for (const id of ["cancel", "cancel-mobile"]) $(id).disabled = on;
    if (on) renderCommand();
  };

  async function oneClick(repo) {
    openRepo(repo.id);
    await new Promise((r) => setTimeout(r, 30));
    await startJob(state.arena ? { action: "clean", arena: state.arena } : { action: "clean" });
  }

  function follow(id) {
    const es = new EventSource(`/api/jobs/${id}/events`);
    state.es = es;
    const finish = (snap) => {
      const secs = (snap.elapsed ?? 0).toFixed(1) + "s";
      state.job = null;
      const cancelled = !!snap.cancelled;
      const ok = snap.exit === 0;
      finishPhases(ok, cancelled);
      // a run you stopped yourself is not a failure, and -15 is not a word
      setStatus(
        cancelled ? "" : ok ? "ok" : "fail",
        cancelled ? `cancelled in ${secs}` : `exit ${snap.exit} in ${secs}`,
      );
      if (!ok && !cancelled) setLogOpen(true);
      setStartEnabled(true);
