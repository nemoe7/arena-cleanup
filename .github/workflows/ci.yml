name: CI

on:
  push:
    branches: [main]
    # Steering syncs carry no shipped code. Their pushes skip CI and never
    # cancel a code run in the concurrency group below.
    paths-ignore: &steering
      - ".agents/**"
      - "ARENA.md"
      - "AGENTS.md"
  pull_request:
    paths-ignore: *steering

# A new push stops the older run of the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: "Lint, format, prose, and tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          # The newest uv in the action's version manifest; a newer release
          # fails the step until the manifest lists it.
          version: "0.13.4"
          # The image runtime: Debian 13 ships Python 3.13.
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group qa
      - run: uv run --no-sync ruff check arena-cleanup.py ui/server.py scripts/*.py tests
      - run: uv run --no-sync ruff format --check arena-cleanup.py ui/server.py scripts/*.py tests
      - run: uv run --no-sync shfmt -i 2 -d docker-entrypoint.sh
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"
      # The browser download is the slow step; a warm cache leaves only the OS
      # packages to install. The key follows the Playwright pin in uv.lock.
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: uv run --no-sync playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: uv run --no-sync playwright install-deps chromium
      # The suite needs git, gpg, git-filter-repo, and Chromium. The runner has
      # the first two; `uv run` puts the third on PATH; the steps above the last.
      - run: uv run --no-sync pytest
