name: CI

on:
  push:
    branches: [main]
    # Steering syncs carry no shipped code. Their pushes skip CI and never
    # cancel a code run in the concurrency group below.
    paths-ignore: &steering
      - ".agents/**"
      - "ARENA.md"
      - "AGENTS.md"
  pull_request:
    paths-ignore: *steering

# A new push stops the older run of the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: "Lint, format, prose, and tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          # Newest uv in the action's version manifest. A newer release
          # fails the step until the manifest lists it.
          version: "0.13.4"
          # The image runtime: Debian 13 ships Python 3.13.
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group qa
      - run: uv run --no-sync ruff check arena-cleanup.py ui/server.py scripts/*.py tests
      - run: uv run --no-sync ruff format --check arena-cleanup.py ui/server.py scripts/*.py tests
      - run: uv run --no-sync shfmt -i 2 -d docker-entrypoint.sh
      # nemoizer reads the prose of every tracked text file, with acorn for JavaScript.
      # A blocking finding fails the step, advisory ones print.
      - run: npm install --no-save --no-package-lock --no-audit --no-fund acorn@8.19.0
      - name: Nemoize prose
        run: |
          uv run --no-sync python .agents/skills/nemoizer/scripts/nemoize.py \
            $(git ls-files | grep -v '^\.agents/\|^ARENA.md\|^LICENSE.md\|\.png$\|\.svg$\|\.ico$\|LICENSE-lucide.txt\|LICENSE-gsap.txt\|gsap.min.js\|manifest.webmanifest')
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"
      # The browser download is the slow step, so a warm cache leaves only OS packages.
      # The key follows the Playwright version, so a release bump keeps its cache.
      - name: Read Playwright version
        id: playwright
        run: |
          v=$(uv run --no-sync python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: uv run --no-sync playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: uv run --no-sync playwright install-deps chromium
      # The suite needs git, gpg, git-filter-repo, and Chromium. The runner has
      # the first two. `uv run` puts git-filter-repo on PATH, and earlier steps Chromium.
      - run: uv run --no-sync pytest
