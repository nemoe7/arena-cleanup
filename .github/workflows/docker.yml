# nonemo: NMO901 (GitHub context names)
name: Docker

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Least privilege at the top. Each job asks for packages: write where it publishes.
permissions:
  contents: read

# Native runners, no arm64 emulation, each push a digest, and a merge job puts one tag
# on the manifest list. A green CI run on main publishes latest, a newer build cancels older.
jobs:
  build:
    name: "Build the ${{ matrix.arch }} image"
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Publishing to GHCR needs more than read, so the job asks for it here.
    permissions:
      contents: read # the checkout of main
      packages: write # the digest push
    concurrency:
      group: docker-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # main is a fixed, trusted ref. The job compares the commit CI tested, never
      # checks it out, so no ref from the event reaches the checkout.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: main
          # the tip and its parent: a steering sync is one amended commit
          fetch-depth: 2

      # The tip may sit one steering sync ahead of the tested commit. CI skips
      # those paths, and the image leaves them out, so that delta passes.
      - name: Pin the tested commit
        env:
          EXPECTED: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          actual="$(git rev-parse HEAD)"
          if [[ "$actual" == "$EXPECTED" ]]; then
            exit 0
          fi
          if ! git merge-base --is-ancestor "$EXPECTED" HEAD 2>/dev/null; then
            echo "main is at $actual, which does not contain the tested $EXPECTED" >&2
            exit 1
          fi
          shipped="$(git diff --name-only "$EXPECTED" HEAD -- . ':!.agents' ':!ARENA.md' ':!AGENTS.md')"
          if [[ -n "$shipped" ]]; then
            {
              echo "main moved past the tested $EXPECTED with shipped changes:"
              echo "$shipped"
            } >&2
            exit 1
          fi
          echo "main is at $actual, steering files only since the tested $EXPECTED"

      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A digest only: the merge job puts latest on the manifest list.
      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # A plain manifest for each platform: no attestation entry hides behind the digest.
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          # The CLI prints its own version. An image that lost the file fails here.
          docker run --rm --entrypoint python3 "${IMAGE}@${DIGEST}" /app/arena-cleanup.py -V
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The two digests land under one manifest list with the one tag.
  publish:
    name: "Publish latest"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # default, named so the write stands out
      packages: write # tag and prune
    concurrency:
      group: docker-latest
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          digests=()
          for file in *; do
            digests+=("${IMAGE}@sha256:${file}")
          done
          if ((${#digests[@]} != 2)); then
            echo "Expected 2 digests in /tmp/digests, found ${#digests[@]}" >&2
            exit 1
          fi
          printf 'digest %s\n' "${digests[@]}"
          docker buildx imagetools create -t "${IMAGE}:latest" "${digests[@]}"
          docker buildx imagetools inspect "${IMAGE}:latest"

      # Each build leaves untagged versions behind, the platform images and the old
      # manifest list. A private package pays for its storage, so the leftovers go.
      - name: Prune untagged versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${REPO%%/*}"
          PACKAGE="${REPO#*/}"
          if gh api "orgs/$OWNER" >/dev/null 2>&1; then
            scope="orgs/$OWNER"
          else
            scope="users/$OWNER"
          fi
          versions="$scope/packages/container/$PACKAGE/versions"
          # The tagged manifest list references the two platform digests, so
          # those stay. Only versions nothing references go.
          keep="$(docker buildx imagetools inspect "ghcr.io/$REPO:latest" --raw | jq -r '.manifests[].digest')"
          if (($(wc -l <<<"$keep") != 2)); then
            echo "Expected 2 referenced digests under latest, found:" >&2
            echo "$keep" >&2
            exit 1
          fi
          mapfile -t stale < <(
            gh api --paginate "$versions?per_page=100" \
              --jq '.[] | select((.metadata.container.tags // []) | length == 0) | "\(.name) \(.id)"' |
              grep -v -F -f <(printf '%s\n' "$keep") | cut -d' ' -f2
          )
          for id in "${stale[@]}"; do
            gh api --method DELETE "$versions/$id"
          done
          echo "Deleted ${#stale[@]} untagged versions."
