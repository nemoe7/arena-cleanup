# Version tags are the pin here. docker.yml's workflow_run builds main only.
rules:
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
  dangerous-triggers:
    ignore:
      - docker.yml
  # ci.yml installs one pinned npm package, the JavaScript parser of the nemoizer.
  adhoc-packages:
    ignore:
      - ci.yml
