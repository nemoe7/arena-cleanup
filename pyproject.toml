[project]
name = "arena-cleanup"
version = "0.3.16"
description = "Web app that cleans an Arena agent branch, rewrites its history, signs it, and publishes it"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = []

[dependency-groups]
dev = [
  "git-filter-repo>=2.47",
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "ruff==0.16.6",
  "shfmt-py>=4.2",
]
qa = [
  "playwright>=1.50",
]

[tool.ruff]
indent-width = 2
required-version = "0.16.6"
exclude = [".agents"]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
extend-safe-fixes = ["C408", "PERF102", "RUF059"]
extend-select = ["E501"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist loadfile -q"
